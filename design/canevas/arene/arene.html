<title>Arène d'essai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap">
<style>
:root{
  color-scheme: dark;
  --nuit:#0f0c18; --nuit2:#181428; --nuit3:#221c38; --trait:#2e2748;
  --mauve:#7a5cc8; --mauve-clair:#b9a2f0;
  --or:#caa968; --or-vif:#f1d28a; --or-filet:rgba(202,169,104,.55); --sur-or:#2b1b06;
  --ivoire:#efe9dc; --sourd:#a9a3b8; --pale:#6f6886;
  --toi:#7fd0b0; --lui:#e59a8a;
  --titre:"Fraunces", Georgia, "Times New Roman", serif;
  --ui:"Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--nuit);color:var(--ivoire);font:15px/1.35 var(--ui);-webkit-tap-highlight-color:transparent;overflow-x:hidden;overscroll-behavior:none}
#ciel{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;height:100%;padding-inline:12px;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid var(--or-vif);outline-offset:2px}
*{box-sizing:border-box}

/* ——— le menu ——— */
.menu{display:flex;flex-direction:column;gap:12px;padding-block:16px 28px}
.menu h1{margin:0;font:700 26px/1.1 var(--titre);display:flex;align-items:center;gap:9px}
.menu h1 svg{width:20px;height:20px;fill:var(--or)}
.menu .sous{margin:0;color:var(--sourd);font-size:15px;text-wrap:balance}
.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tuile{position:relative;display:flex;flex-direction:column;gap:0;text-align:left;border:1px solid var(--trait);border-radius:13px;overflow:hidden;background:var(--nuit2);padding:0;transition:transform .12s}
.tuile:active{transform:scale(.98)}
.tuile .vis{height:92px;position:relative;overflow:hidden;background:#1d1732}
.tuile .vis img{position:absolute;width:62px;height:78px;object-fit:cover;border-radius:6px;border:1px solid var(--or-filet);box-shadow:0 4px 10px rgba(0,0,0,.5)}
.tuile .num{position:absolute;left:8px;top:6px;font:700 13px var(--titre);color:var(--or-vif);z-index:2;text-shadow:0 1px 2px #000}
.tuile .corps{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.tuile b{font:600 16px/1.1 var(--ui)}
.tuile .acc{font-size:13px;color:var(--sourd);line-height:1.25}
.tuile .meta{margin-top:4px;display:flex;justify-content:space-between;font-size:12px;color:var(--pale);font-variant-numeric:tabular-nums}
.tuile .meta .jouee{color:var(--mauve-clair)}
.menu h2.groupe{margin:10px 0 0;font:700 20px var(--titre);color:var(--or-vif)}
.groupe-replie{border-top:1px solid var(--trait);padding-top:8px}
.groupe-replie summary{cursor:pointer;font:700 17px var(--titre);color:var(--sourd);padding:6px 0}
.groupe-replie[open] summary{color:var(--or-vif)}
.groupe-replie .tuiles{margin-top:8px}
.menu .pied{font-size:13px;color:var(--pale);text-align:center;margin:4px 0 0}

/* ——— l'écran d'une démo ——— */
.ecran{height:100%;display:flex;flex-direction:column;gap:6px;padding-block:8px 10px}
.ecran .tete{display:flex;align-items:center;gap:8px;min-height:36px}
.retour{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--trait);background:var(--nuit2);display:grid;place-items:center}
.retour svg{width:18px;height:18px;stroke:var(--ivoire);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ecran .nomdemo{flex:1;min-width:0;font:700 17px/1.1 var(--titre);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{display:flex;align-items:center;gap:6px;font:700 20px var(--titre);font-variant-numeric:tabular-nums;white-space:nowrap}
.score .j{color:var(--toi)} .score .a{color:var(--lui)} .score .sep{font:500 12px var(--ui);color:var(--pale)}
.consigne{min-height:30px;display:flex;align-items:center;justify-content:center;text-align:center;font:600 16px/1.15 var(--ui);letter-spacing:.02em;color:var(--or-vif);background:rgba(24,20,40,.8);border:1px solid var(--trait);border-radius:10px;padding:4px 10px}
.consigne.lui{color:var(--lui)}
.consigne.calme{color:var(--sourd)}
.scene{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;position:relative}

/* ——— les cartes ——— */
.carte{position:relative;border-radius:8px;overflow:hidden;background:var(--nuit3);border:1px solid var(--or-filet);aspect-ratio:4/5;flex:none;-webkit-user-select:none;user-select:none}
.carte img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.carte::after{content:"";position:absolute;inset:0;border-top:3px solid var(--t,#888);border-radius:8px;pointer-events:none}
.carte.sbire{background:linear-gradient(160deg,color-mix(in srgb,var(--t) 40%,#15101f),#120e1c 85%)}
.carte .embleme{position:absolute;inset:12% 16% 30%;display:grid;place-items:center}
.carte .embleme svg{width:100%;height:100%;fill:var(--t);opacity:.85}
.carte .nom{position:absolute;left:0;right:0;bottom:0;padding:12px 3px 3px;background:linear-gradient(0deg,rgba(10,8,16,.95),rgba(10,8,16,.7) 60%,transparent);font:600 11px/1.05 var(--ui);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carte .force{position:absolute;right:3px;top:4px;min-width:22px;height:22px;padding:0 4px;border-radius:6px 6px 11px 11px;display:grid;place-items:center;font:700 14px var(--titre);color:var(--sur-or);background:linear-gradient(180deg,var(--or-vif),var(--or));box-shadow:0 1px 3px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.carte .gem{position:absolute;left:3px;top:4px;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--ui);color:#fff;background:radial-gradient(circle at 35% 30%,#cdb8ff 0,#8363d8 40%,#3d2a7a 100%);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.carte.j{border-color:var(--toi);box-shadow:0 0 0 2px var(--toi)}
.carte.a{border-color:var(--lui);box-shadow:0 0 0 2px var(--lui)}
.carte.choisie{transform:translateY(-9px);box-shadow:0 0 0 3px var(--or-vif),0 8px 14px rgba(0,0,0,.5)}
.carte.eteinte{filter:grayscale(.8) brightness(.5)}
.carte.brille{animation:brille 1.1s ease-in-out infinite}
@keyframes brille{50%{box-shadow:0 0 0 3px var(--or-vif)}}
.carte.dos{background:linear-gradient(160deg,#3b2d63,#1d1634);border-color:rgba(202,169,104,.45)}
.carte.dos::after{border-top-color:transparent}
.carte.dos svg{position:absolute;inset:22%;width:56%;height:56%;fill:var(--or)}
.retourne{animation:retourne .45s ease-out}
@keyframes retourne{0%{transform:rotateY(90deg) scale(1.08)}100%{transform:none}}
.secoue{animation:secoue .32s}
@keyframes secoue{25%{transform:translateX(-5px)}50%{transform:translateX(5px);filter:brightness(1.7)}75%{transform:translateX(-2px)}}
.bond{animation:bond .3s ease-out}
@keyframes bond{40%{transform:translateY(-10px) scale(1.05)}}

/* ——— boutons ——— */
.btn{border:none;border-radius:12px;padding:12px 16px;font:700 17px var(--ui);letter-spacing:.03em;transition:transform .1s,filter .1s}
.btn:active{transform:translateY(2px)}
.btn[disabled]{filter:grayscale(.85) brightness(.5);cursor:default}
.btn.or{color:var(--sur-or);background:linear-gradient(180deg,var(--or-vif),var(--or) 60%,#a8864a);box-shadow:0 3px 0 #6d5427,0 5px 10px rgba(0,0,0,.4)}
.btn.or:active{box-shadow:0 1px 0 #6d5427}
.btn.sec{background:var(--nuit3);color:var(--ivoire);border:1px solid #3a3257;font-weight:600;font-size:15px}
.btn.mauve{color:#fff;background:linear-gradient(180deg,#9b7fe6,#5e44a8);box-shadow:0 3px 0 #35266a}
.rangee{display:flex;gap:8px}
.rangee .btn{flex:1}

/* ——— nombres qui s'envolent ——— */
#flots{position:fixed;inset:0;pointer-events:none;z-index:40}
.flot{position:fixed;transform:translate(-50%,-50%);font:700 22px var(--titre);color:#fff;text-shadow:0 2px 0 #000,0 0 3px #000;animation:flot .9s ease-out forwards;white-space:nowrap}
.flot.or{color:var(--or-vif);font-size:26px}
.flot.vert{color:var(--toi)} .flot.rose{color:var(--lui)}
.flot.mot{font:700 15px var(--ui);color:var(--mauve-clair);letter-spacing:.04em}
.flot.gros{font-size:34px;color:var(--or-vif)}
@keyframes flot{0%{opacity:0;margin-top:8px}15%{opacity:1}100%{opacity:0;margin-top:-40px}}

/* ——— le guide ——— */
#guide{position:fixed;inset:0;z-index:50;pointer-events:none}
#guide .mur{position:fixed;background:rgba(6,5,12,.66);pointer-events:auto}
#guide .anneau{position:fixed;border:2px solid var(--or-vif);border-radius:12px;animation:anneau 1.2s ease-in-out infinite}
@keyframes anneau{50%{box-shadow:0 0 0 5px rgba(241,210,138,.25)}}
#guide .doigt{position:fixed;width:44px;height:44px;transform:translate(-8px,-4px);animation:doigt 1.1s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}
#guide .doigt.tire{animation:tire 1.6s ease-in-out infinite}
@keyframes doigt{50%{transform:translate(-8px,6px)}}
@keyframes tire{0%{transform:translate(-8px,-4px);opacity:0}15%{opacity:1}70%{transform:translate(-8px,90px);opacity:1}100%{transform:translate(-8px,90px);opacity:0}}
#guide .bulle{position:fixed;left:50%;transform:translateX(-50%);width:min(340px,calc(100% - 32px));background:linear-gradient(180deg,#352a5e,#231b40);border:1px solid var(--or);border-radius:14px;padding:12px 14px;text-align:center;font:600 19px/1.2 var(--ui);color:var(--ivoire);box-shadow:0 10px 26px rgba(0,0,0,.55);pointer-events:auto}
#guide .bulle small{display:block;margin-top:7px;font:500 13px var(--ui);color:var(--or-vif);letter-spacing:.06em;text-transform:uppercase}
#guide .passer{position:fixed;right:12px;top:10px;pointer-events:auto;background:rgba(24,20,40,.9);border:1px solid var(--trait);border-radius:9px;padding:6px 10px;font-size:13px;color:var(--sourd)}

/* ——— fin de partie ——— */
#fin{position:fixed;inset:0;z-index:45;background:rgba(8,6,14,.72);display:grid;place-items:center;padding:16px}
.fin-boite{width:min(400px,100%);background:linear-gradient(180deg,#2d2350,#191430);border:1px solid var(--or-filet);border-radius:16px;padding:20px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;animation:entre .35s ease-out}
.fin-boite svg{width:44px;height:44px;fill:var(--or-vif);margin:0 auto}
.fin-boite h2{margin:0;font:700 32px var(--titre)}
.fin-boite p{margin:0;color:var(--sourd);text-wrap:balance}
.fin-boite .compte{font-size:13px;color:var(--mauve-clair)}
.fin-boite .btn{width:100%}
@keyframes entre{0%{opacity:0;transform:translateY(12px) scale(.95)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* ═══ C2 · Le Carré des astres v2 ═══ */
@property --cc-ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
/* ——— la carte ——— */
.cc{--w:64px;position:relative;width:var(--w);aspect-ratio:5/7;border-radius:calc(var(--w)*.07);overflow:hidden;flex:none;user-select:none;-webkit-user-select:none;cursor:pointer;isolation:isolate;box-shadow:0 2px 6px rgba(0,0,0,.55);transition:transform .15s}
.cc-cadre{position:absolute;inset:0;z-index:0;background:linear-gradient(160deg,#2c2931,#1c1a20)}
.cc-cadre::after{content:"";position:absolute;inset:3.5%;border:1px solid rgba(196,160,98,.45);border-radius:calc(var(--w)*.045)}
.cc-art{position:absolute;left:8%;right:8%;top:6.5%;bottom:20%;z-index:1;overflow:hidden;border-radius:calc(var(--w)*.03);background:#111;box-shadow:0 0 0 1px rgba(196,160,98,.55)}
.cc-art img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cc-art.sbire{display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--e) 42%,#15101f),#120e1c 85%)}
.cc-art.sbire svg{width:58%;height:auto;fill:var(--e);opacity:.9}
.cc-fx{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.cc-ch{position:absolute;left:4.5%;top:4%;z-index:4;width:calc(var(--w)*.46);height:calc(var(--w)*.46);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center;background:rgba(10,8,16,.84);border:1px solid rgba(196,160,98,.6);border-radius:calc(var(--w)*.06);font:700 calc(var(--w)*.15)/1 var(--titre);color:#fff;font-variant-numeric:tabular-nums}
.cc-ch b{font-weight:700}
.cc-h{grid-area:1/2} .cc-g{grid-area:2/1} .cc-d{grid-area:2/3} .cc-b{grid-area:3/2}
.cc-ch b.plus{color:var(--toi)} .cc-ch b.moins{color:#ff9a8a}
.cc-pouv{position:absolute;right:4.5%;top:4%;z-index:4;width:calc(var(--w)*.28);height:calc(var(--w)*.28);border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a2c66,#140f24);border:1.5px solid var(--or-vif);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.7)}
.cc-pouv svg,.c3-g svg,.cf-pouv>svg,.c3-gelee svg,.cc-bouclier{width:64%;height:64%;fill:var(--or-vif);stroke:var(--or-vif);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cc-nom{position:absolute;left:5%;right:5%;bottom:4%;height:13%;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:2px;padding:0 5%;border-radius:calc(var(--w)*.03);background:rgba(20,16,30,.88);border:1px solid rgba(196,160,98,.4);font:600 calc(var(--w)*.12)/1 var(--ui);color:var(--ivoire);white-space:nowrap;overflow:hidden}
.cc-nom span{overflow:hidden;text-overflow:ellipsis}
.cc-st{display:flex;gap:1px;flex:none;font-style:normal}
.cc-st u{width:calc(var(--w)*.045);height:calc(var(--w)*.045);border-radius:50%;background:#4a4160;text-decoration:none}
.cc-st u.on{background:var(--or-vif)}
.cc-poids{position:absolute;left:4.5%;bottom:19%;z-index:5;width:calc(var(--w)*.22);height:calc(var(--w)*.22);border-radius:50%;background:var(--mauve);color:#fff;font:700 calc(var(--w)*.14)/calc(var(--w)*.22) var(--ui);text-align:center;box-shadow:0 1px 2px #000}
.cc-etat{position:absolute;inset:0;z-index:6;display:grid;place-items:center;pointer-events:none}
.cc-bouclier{width:44%;height:44%;opacity:.85;filter:drop-shadow(0 1px 2px #000);fill:rgba(241,210,138,.3)}
/* les camps */
.cc.camp-j{box-shadow:0 0 0 calc(var(--w)*.035) var(--toi),0 2px 6px #000}
.cc.camp-a{box-shadow:0 0 0 calc(var(--w)*.035) var(--lui),0 2px 6px #000}
.cc.camp-j .cc-nom{background:linear-gradient(90deg,rgba(63,156,125,.95),rgba(20,16,30,.9));border-color:var(--toi)}
.cc.camp-a .cc-nom{background:linear-gradient(90deg,rgba(170,80,68,.95),rgba(20,16,30,.9));border-color:var(--lui)}
.cc.choisie{transform:translateY(-10px);box-shadow:0 0 0 3px var(--or-vif),0 8px 14px rgba(0,0,0,.6)}
.cc.dans{filter:brightness(.45) grayscale(.5)}
.cc.pose{animation:entre .32s ease-out}
.cc.retourne{animation:retourne .45s ease-out}
/* ——— les variantes ——— */
.cc.v-or .cc-cadre{background:linear-gradient(125deg,#6f5220 0%,#d7b86e 20%,#8c6a2d 38%,#f2dd9f 55%,#9a7634 72%,#cfa95f 88%,#7a5a24 100%)}
.cc.v-or .cc-cadre::after{border-color:rgba(255,240,194,.75)}
.cc.v-or .cc-art{box-shadow:0 0 0 1px #fbe7a8}
.cc.v-or .cc-art img{filter:sepia(.22) saturate(1.08)}
.cc.v-or .cc-fx{background:linear-gradient(115deg,transparent 38%,rgba(255,242,204,.4) 49%,transparent 60%);background-size:320% 100%;animation:ccBal 3.8s ease-in-out infinite}
.cc.v-ombre .cc-cadre{background:radial-gradient(circle at 30% 20%,#2b2d33,#0a0a0c 62%)}
.cc.v-ombre .cc-cadre::after{border-color:rgba(190,196,208,.5)}
.cc.v-ombre .cc-art{box-shadow:0 0 0 1px rgba(190,196,208,.55)}
.cc.v-ombre .cc-art img{filter:grayscale(.72) brightness(.78) contrast(1.2)}
.cc.v-ombre .cc-fx{background:radial-gradient(ellipse 60% 30% at 20% 85%,rgba(200,205,215,.2),transparent),radial-gradient(ellipse 50% 25% at 80% 20%,rgba(200,205,215,.14),transparent);animation:ccBrume 7s ease-in-out infinite alternate}
.cc.v-elem .cc-cadre{background:linear-gradient(150deg,var(--es),var(--e) 42%,var(--es) 72%,var(--ec))}
.cc.v-elem .cc-cadre::after{border-color:color-mix(in srgb,var(--ec) 70%,transparent)}
.cc.v-elem .cc-art{box-shadow:0 0 0 1px var(--ec)}
.cc.v-elem .cc-fx i{position:absolute;bottom:-3%;width:calc(var(--w)*.035);height:calc(var(--w)*.035);border-radius:50%;background:var(--ec);animation:ccMonte 3s linear infinite}
.cc.v-prisme .cc-cadre{background:linear-gradient(125deg,#aab2be 0%,#f4f6f9 14%,#8a929f 30%,#eef1f5 46%,#959dab 62%,#f7f9fb 78%,#a1a9b6 100%)}
.cc.v-prisme .cc-cadre::after{border-color:rgba(240,244,255,.8)}
.cc.v-prisme .cc-art{box-shadow:0 0 0 1px #fff}
.cc.v-prisme .cc-fx{background:linear-gradient(115deg,transparent 22%,rgba(255,120,160,.5) 36%,rgba(255,230,120,.5) 44%,rgba(120,255,200,.5) 52%,rgba(120,180,255,.5) 60%,rgba(200,140,255,.45) 68%,transparent 80%);background-size:300% 100%;mix-blend-mode:color-dodge;animation:ccBal 4.6s linear infinite}
.cc.v-full .cc-cadre{background:none}
.cc.v-full .cc-cadre::after{border-color:rgba(255,255,255,.3)}
.cc.v-full .cc-art{inset:0;border-radius:0;box-shadow:none}
.cc.v-full::before{content:"";position:absolute;inset:0;z-index:3;padding:calc(var(--w)*.03);border-radius:inherit;background:conic-gradient(from var(--cc-ang),#ff7a9a,#ffd36e,#7dffb0,#6fd0ff,#b58cff,#ff7a9a);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ccArc 5s linear infinite;pointer-events:none}
.cc.v-full .cc-ch,.cc.v-full .cc-nom{background:rgba(10,8,16,.55);border-color:rgba(255,255,255,.5)}
@keyframes ccBal{0%{background-position:120% 0}100%{background-position:-20% 0}}
@keyframes ccBrume{0%{transform:translateX(-6%)}100%{transform:translateX(6%)}}
@keyframes ccMonte{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(calc(var(--w)*-1.35));opacity:0}}
@keyframes ccArc{to{--cc-ang:360deg}}
/* ——— la fiche d'une carte ——— */
.cf-voile{position:fixed;inset:0;z-index:60;background:rgba(6,5,12,.78);display:flex;align-items:center;justify-content:center;padding:16px}
.cf-boite{width:min(380px,100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:10px;background:linear-gradient(180deg,#2d2350,#191430);border:1px solid var(--or-filet);border-radius:16px;padding:14px;animation:entre .25s ease-out}
.cf-txt{width:100%;display:flex;flex-direction:column;gap:6px}
.cf-txt h3{margin:0;font:700 22px var(--titre);text-align:center}
.cf-sous{font-size:12.5px;color:var(--sourd);text-align:center}
.cf-pouv{display:flex;gap:10px;align-items:flex-start;background:rgba(10,8,16,.55);border:1px solid var(--or-filet);border-radius:12px;padding:9px}
.cf-pouv>svg{flex:none;width:34px;height:34px;padding:6px;border-radius:50%;background:#140f24;border:1.5px solid var(--or-vif)}
.cf-pouv b{display:block;font:700 17px var(--titre);color:var(--or-vif)}
.cf-pouv em{display:block;font-style:normal;font-size:12px;color:var(--mauve-clair);text-transform:uppercase;letter-spacing:.06em}
.cf-pouv p{margin:3px 0 0;font-size:15px;line-height:1.3;color:var(--ivoire)}
.cf-pouv small{display:block;margin-top:5px;font-size:12.5px;color:var(--sourd)}
.cf-sans{margin:0;font-size:14px;color:var(--sourd);text-align:center}
.cf-reg{display:flex;flex-direction:column;gap:6px}
.cf-reg small{font-size:11.5px;color:var(--pale)}
.cf-ligne{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:13px;color:var(--sourd)}
.cf-ac{display:flex;gap:8px;flex-wrap:wrap}
.cf-ac .btn{flex:1;padding:10px}
/* ——— les pages ——— */
.c3-page{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
.c3-rang{display:flex;gap:6px;overflow-x:auto;padding:6px 3px;flex:none;align-items:flex-end}
.main-a{justify-content:center;padding:4px 3px}
.main-j{padding-top:12px;justify-content:center}
.c3-niv{margin-left:8px;font:700 10.5px var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;vertical-align:2px}
.c3-niv.apprenti{background:rgba(127,208,176,.25);color:var(--toi)}
.c3-niv.aventurier{background:rgba(241,210,138,.2);color:var(--or-vif)}
.c3-niv.maitre{background:rgba(229,154,138,.25);color:var(--lui)}
.c3-deck.actif{border-color:var(--or-vif)}
.c3-nomdeck{font:700 18px var(--titre);color:var(--ivoire);background:rgba(10,8,16,.5);border:1px solid #4a3d78;border-radius:9px;padding:6px 9px;width:100%;box-sizing:border-box}
.c3-jauge{position:relative;height:16px;border-radius:8px;background:#2a2340;overflow:hidden}
.c3-jauge i{display:block;height:100%;background:linear-gradient(90deg,#8f6fe0,#b9a2f0)}
.c3-jauge.trop i{background:var(--lui)}
.c3-jauge span{position:absolute;inset:0;text-align:center;font:700 11px/16px var(--ui);color:#fff;text-shadow:0 1px 1px #000}
.c3-slots{display:flex;gap:6px;justify-content:space-between;flex-wrap:wrap}
.c3-vide{width:60px;aspect-ratio:5/7;border-radius:5px;border:1px dashed var(--or-filet);display:grid;place-items:center;color:var(--pale);font:700 20px var(--ui)}
.c3-filtres{display:flex;gap:4px;flex-wrap:wrap}
.c3-chip{border:1px solid #4a3d78;background:#231c40;color:var(--ivoire);border-radius:14px;padding:4px 9px;font:600 12px var(--ui)}
.c3-chip.on{background:var(--mauve);border-color:var(--or-vif)}
.c3-col{display:grid;grid-template-columns:repeat(auto-fill,64px);gap:7px;justify-content:space-between}
/* ——— le plateau ——— */
.c3-plateau{position:relative;align-self:center;width:min(100%,286px);padding:10px;border-radius:18px;flex:none;background:radial-gradient(circle at 50% 45%,#2c2254 0%,#171229 72%);border:1px solid var(--or-filet);box-shadow:inset 0 0 0 4px rgba(10,8,16,.65),inset 0 0 0 5px rgba(202,169,104,.35),0 6px 18px rgba(0,0,0,.5)}
.c3-plateau.n4{width:min(100%,318px)}
.c3-astrolabe{position:absolute;inset:4%;width:92%;height:92%;fill:none;stroke:rgba(202,169,104,.16);stroke-width:.35;pointer-events:none}
.c3-grille{position:relative;z-index:1;display:grid;gap:6px}
.c3-case{container-type:inline-size;aspect-ratio:5/7;border-radius:9px;border:1px solid rgba(202,169,104,.25);background:rgba(10,8,16,.45);padding:0;position:relative;display:grid;place-items:center;min-width:0}
.c3-case .cc{--w:100cqw;width:100%}
.c3-case.libre{border:2px solid var(--or-vif);background:rgba(58,44,102,.55)}
.c3-case.terre{border-color:var(--t);background:color-mix(in srgb,var(--t) 16%,rgba(10,8,16,.55))}
.c3-case.terre>svg{width:36%;height:auto;fill:var(--t)}
.c3-case.terre>span,.c3-case.gouffre>span{position:absolute;bottom:9%;left:0;right:0;text-align:center;font:600 11px var(--ui);color:var(--t)}
.c3-case.gouffre{background:repeating-linear-gradient(45deg,#0a0810 0 6px,#15111f 6px 12px);border-color:#0a0810}
.c3-case.gouffre>span{color:var(--pale)}
.c3-case.gelee{background:rgba(143,195,222,.22);border:2px solid #bfe3f2}
.c3-gelee{position:absolute;inset:25%;display:grid;place-items:center}
.c3-gelee svg{width:100%;height:100%;stroke:#e6f6ff;fill:none}
.c3-traits{position:absolute;left:10px;top:10px;width:calc(100% - 20px);height:calc(100% - 20px);z-index:3;pointer-events:none}
.c3-traits line{stroke:var(--or-vif);stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round;animation:ccTrait 2.6s ease-out forwards}
@keyframes ccTrait{0%{opacity:1}70%{opacity:.9}100%{opacity:0}}
.c3-scores{flex:none;display:flex;justify-content:space-between;align-items:center;font:700 15px var(--titre);padding:0 4px}
.c3-scores .j{color:var(--toi)} .c3-scores .a{color:var(--lui)}
.c3-scores .sep{font:500 11.5px var(--ui);color:var(--pale);text-align:center}
.c3-bande{flex:none;min-height:40px;display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:10px;background:rgba(24,20,40,.85);border:1px solid var(--trait);font-size:13px;line-height:1.25;color:var(--ivoire)}
.c3-bande b{color:var(--or-vif);font-weight:600}
.c3-bande span{color:var(--sourd)}
.c3-g{flex:none;width:28px;height:28px;border-radius:50%;background:#140f24;border:1.5px solid var(--or-vif);display:grid;place-items:center}
@media (prefers-reduced-motion:reduce){.cc-fx{animation:none!important}.cc.v-full::before{animation:none}}
/* (repris de la v1) */
.c2-adv{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:7px 9px;border-radius:10px;border:1px solid var(--trait);background:var(--nuit2);gap:2px;color:var(--ivoire)}
.c2-adv b{font:600 14px var(--ui)}
.c2-adv>span{font-size:12px;color:var(--sourd)}
.c2-adv.sel{border-color:var(--or-vif);background:#2d2350}
.c2-go{flex:none}
.c2-trop{color:var(--lui);font-size:13px}

/* 1 · Le Carré des astres */
.cr-main{display:flex;justify-content:center;gap:6px;flex:none}
.cr-a .carte{width:46px}
.cr-j{padding-top:10px}
.cr-j .carte{width:62px;cursor:pointer;transition:transform .15s}
.cr-plateau{align-self:center;width:min(100%,300px);display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:6px;border-radius:14px;background:rgba(24,20,40,.72);border:1px solid var(--or-filet);flex:none}
.cr-case{aspect-ratio:4/5;border-radius:9px;border:1px dashed #3a3257;background:rgba(15,12,24,.55);padding:0;display:grid;place-items:center;position:relative}
.cr-case .carte{width:100%;height:100%}
.cr-case.cr-libre{border:2px solid var(--or-vif);background:rgba(58,44,102,.45)}
.cr-terre{border:1px solid var(--t);background:color-mix(in srgb,var(--t) 14%,#120e1c)}
.cr-terre svg{width:34%;height:auto;fill:var(--t)}
.cr-terre span{position:absolute;bottom:9%;left:0;right:0;text-align:center;font:600 12px var(--ui);color:var(--t)}
.cr-n{position:absolute;min-width:18px;height:18px;padding:0 3px;border-radius:5px;background:rgba(10,8,16,.9);font:700 13px/18px var(--ui);text-align:center;color:#fff;font-variant-numeric:tabular-nums;z-index:2}
.cr-h{top:3px;left:50%;transform:translateX(-50%)}
.cr-b{bottom:3px;left:50%;transform:translateX(-50%)}
.cr-g{left:3px;top:50%;transform:translateY(-50%)}
.cr-d{right:3px;top:50%;transform:translateY(-50%)}
.cr-j .cr-b{bottom:17px}
.cr-n.plus{color:var(--toi)}
.cr-a .cr-n{min-width:14px;height:14px;font-size:10px;line-height:14px;padding:0 2px}
.carte.cj{border-color:var(--toi);box-shadow:0 0 0 2px var(--toi)}
.carte.ca{border-color:var(--lui);box-shadow:0 0 0 2px var(--lui)}
.carte.cj::before,.carte.ca::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none}
.carte.cj::before{background:linear-gradient(180deg,rgba(127,208,176,.05) 30%,rgba(127,208,176,.5))}
.carte.ca::before{background:linear-gradient(180deg,rgba(229,154,138,.05) 30%,rgba(229,154,138,.5))}
.cr-pose{animation:entre .3s ease-out}

/* 2 · Le Palet des légendes */
.pl-rang{display:flex;align-items:center;gap:4px;flex:none;min-height:40px;padding-inline:2px}
.pl-rang .carte{width:30px}
.pl-lib{font:600 14px var(--ui);color:var(--toi);margin-right:6px;white-space:nowrap}
.pl-lib.lui{color:var(--lui)}
.pl-cadre{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
.pl-canvas{touch-action:none;display:block}

/* 3 · Les Constellations */
.cs-boss{display:flex;gap:12px;align-items:center;background:rgba(24,20,40,.78);border:1px solid var(--trait);border-radius:12px;padding:8px;flex:none}
.cs-bosscarte{width:72px}
.cs-info{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.cs-bnom{font:700 19px var(--titre)}
.cs-pv{height:11px;border-radius:6px;background:#2a2340;overflow:hidden}
.cs-pv i{display:block;height:100%;background:linear-gradient(90deg,#e59a8a,#e0743a);transition:width .5s}
.cs-pvtxt{font:600 14px var(--ui);color:var(--sourd);font-variant-numeric:tabular-nums}
.cs-cpt{display:flex;gap:14px;font-size:13.5px;color:var(--sourd)}
.cs-cpt b{color:var(--or-vif);font:700 17px var(--titre)}
.cs-calc{min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:none}
.cs-cnom{font:700 23px/1.1 var(--titre);color:var(--or-vif)}
.cs-cform{font:600 17px var(--ui);color:var(--ivoire);font-variant-numeric:tabular-nums}
.cs-vide{color:var(--sourd);font-size:14.5px;max-width:290px;text-wrap:balance}
.cs-astres{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;flex:none}
.cs-astre{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;background:#2a2045;border:1px solid var(--or-filet);font:600 12.5px var(--ui);cursor:pointer}
.cs-astre svg{width:14px;height:14px;fill:var(--or-vif)}
.cs-main{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding-top:12px;margin-top:auto;flex:none}
.cs-main .carte{width:100%;cursor:pointer;transition:transform .15s}
.cs-type{position:absolute;left:3px;top:6px;font:700 9.5px var(--ui);text-transform:uppercase;letter-spacing:.04em;text-shadow:0 1px 2px #000,0 0 2px #000}
.cs-lignes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
.cs-trait{fill:none;stroke:var(--or-vif);stroke-width:2.5;stroke-dasharray:5 5}
.cs-lignes polygon{fill:var(--or-vif)}
.cs-graine{font-size:11.5px;color:var(--pale);text-align:center;flex:none}
.cs-choix{position:absolute;inset:0;z-index:5;background:rgba(10,8,18,.94);border-radius:14px;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:16px;text-align:center}
.cs-choix h3{margin:0;font:700 24px var(--titre)}
.cs-choix p{margin:0;color:var(--sourd)}
.cs-astrechoix{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px;border-radius:14px;border:1px solid var(--or);background:linear-gradient(180deg,#352a5e,#231b40)}
.cs-astrechoix svg{width:28px;height:28px;fill:var(--or-vif)}
.cs-astrechoix b{font:700 19px var(--titre)}
.cs-astrechoix span{color:var(--sourd);font-size:14.5px}

/* 4 · Le Duel des ombres */
.du-terres{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;flex:none}
.du-terre{border-radius:8px;padding:4px 2px;text-align:center;background:rgba(24,20,40,.72);border:1px solid var(--trait);display:flex;flex-direction:column;gap:1px}
.du-terre b{font:600 10px var(--ui);color:var(--pale);text-transform:uppercase;letter-spacing:.05em}
.du-terre span{font:700 12.5px var(--ui);color:var(--t)}
.du-terre.ici{border-color:var(--t);background:color-mix(in srgb,var(--t) 22%,#151022)}
.du-terre.ici b{color:var(--ivoire)}
.du-terre.passee{opacity:.35}
.du-main{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;flex:none}
.du-a{padding-inline:22px}
.du-a .carte,.du-j .carte{width:100%}
.du-j{padding-top:10px}
.du-j .carte{cursor:pointer;transition:transform .15s}
.du-bonus{position:absolute;left:3px;top:4px;font:700 12px var(--ui);color:#fff;background:var(--t);border-radius:5px;padding:0 4px;box-shadow:0 1px 2px #000}
.du-fl{position:absolute;left:0;right:0;bottom:0;text-align:center;font:700 10px var(--ui);text-transform:uppercase;padding:2px 0;letter-spacing:.03em}
.du-fl.vert{background:rgba(127,208,176,.92);color:#0c2a20}
.du-fl.rose{background:rgba(229,154,138,.92);color:#3a120b}
.du-arene{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.du-vide{color:var(--sourd);font-size:15.5px;text-align:center}
.du-slot{display:flex;align-items:center;gap:12px}
.du-slot .carte{width:68px}
.du-calc{font:700 18px var(--ui);color:var(--toi);font-variant-numeric:tabular-nums}
.du-calc.lui{color:var(--lui)}
.du-mil{font:700 19px var(--titre);color:var(--sourd);text-align:center}
.du-mil.vert{color:var(--toi)} .du-mil.rose{color:var(--lui)}
.du-note{font-size:13.5px;color:var(--mauve-clair)}
.btn.mauve.actif{outline:3px solid var(--or-vif);outline-offset:1px}

/* 5 · La Poussée en rythme */
.ry-jauge{flex:none;display:flex;flex-direction:column;gap:3px}
.ry-cases{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}
.ry-case{height:22px;border-radius:4px;background:#221c38;display:grid;place-items:center}
.ry-case.bj{background:color-mix(in srgb,var(--toi) 40%,#1b1630)}
.ry-case.ba{background:color-mix(in srgb,var(--lui) 40%,#1b1630)}
.ry-case.ici{background:#3a2c66}
.ry-case svg{width:26px;height:26px;fill:var(--or-vif);filter:drop-shadow(0 1px 1px #000)}
.ry-bords{display:flex;justify-content:space-between;font:600 12px var(--ui);color:var(--sourd);text-transform:uppercase;letter-spacing:.05em}
.ry-bords .j{color:var(--toi)} .ry-bords .a{color:var(--lui)}
.ry-queue{display:flex;align-items:center;gap:5px;flex:none;min-height:40px}
.ry-queue .carte{width:30px}
.ry-lib{font:600 13px var(--ui);color:var(--toi);margin-right:4px}
.ry-lib.lui{color:var(--lui)}
.ry-scene{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:space-around;align-items:center;touch-action:manipulation;border-radius:14px;background:rgba(24,20,40,.55);border:1px solid var(--trait);overflow:hidden;cursor:pointer;padding-block:6px}
.ry-front{display:flex;flex-direction:column;align-items:center;gap:3px}
.ry-carte{width:min(104px,24vh)}
.ry-pv{width:min(104px,24vh);height:8px;border-radius:4px;background:#2a2340;overflow:hidden}
.ry-pv i{display:block;height:100%;background:var(--toi);transition:width .3s}
.ry-pa .ry-pv i{background:var(--lui)}
.ry-stat{font:600 12.5px var(--ui);color:var(--sourd)}
.ry-mot{font:700 23px var(--titre);min-height:30px;text-align:center;color:var(--sourd)}
.ry-mot.parfait{color:var(--or-vif)} .ry-mot.bien{color:var(--toi)} .ry-mot.rate{color:var(--lui)}
.ry-cible{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed rgba(239,233,220,.85);pointer-events:none}
.ry-anneau{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:4px solid var(--or-vif);pointer-events:none}
.ry-frappeJ{animation:frJ .3s ease-out}
@keyframes frJ{40%{transform:translateY(-26px)}}
.ry-frappeA{animation:frA .3s ease-out}
@keyframes frA{40%{transform:translateY(26px)}}

/* 6 · La Caravane */
.cv-info{display:flex;align-items:center;justify-content:space-between;flex:none}
.cv-lib{font:600 15px var(--ui);color:var(--sourd)}
.cv-etapes{display:flex;gap:4px}
.cv-etapes svg{width:20px;height:20px;fill:#3a3257}
.cv-etapes .ok svg{fill:var(--or-vif)}
.cv-rang{display:flex;flex-wrap:wrap;align-items:flex-end;gap:5px;flex:none;padding-block:2px}
.cv-rang .cv-tit{flex-basis:100%}
.cv-tit{font:600 12.5px var(--ui);color:var(--toi);text-transform:uppercase;letter-spacing:.06em}
.cv-tit.lui{color:var(--lui)}
.cv-m{width:54px;display:flex;flex-direction:column;gap:2px;position:relative}
.cv-m .carte{width:100%}
.cv-m.devant{width:70px}
.cv-m.sel .carte{box-shadow:0 0 0 3px var(--or-vif)}
.cv-m.cible .carte{outline:2px dashed var(--or-vif);outline-offset:1px}
.cv-pv{height:6px;border-radius:3px;background:#2a2340;overflow:hidden}
.cv-pv i{display:block;height:100%;background:var(--toi);transition:width .25s}
.cv-adv .cv-pv i{background:var(--lui)}
.cv-st{font:600 11px var(--ui);color:var(--sourd);text-align:center;font-variant-numeric:tabular-nums}
.cv-niv{position:absolute;left:0;right:0;top:3px;text-align:center;color:var(--or-vif);font-size:12px;text-shadow:0 1px 2px #000;z-index:2}
.cv-mil{flex:1;min-height:4px}
.cv-offres{flex:none;display:flex;flex-direction:column;gap:5px}
.cv-grille{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-inline:8px}
.cv-offre{padding:0;border:none;background:none;display:flex;flex-direction:column;gap:3px;align-items:center}
.cv-offre .carte{width:100%}
.cv-os{font:600 13px var(--ui);color:var(--sourd)}
.cv-offre.monte .cv-os{color:var(--or-vif)}
.cv-offre.monte .carte{box-shadow:0 0 0 2px var(--or-vif)}
.cv-coupJ{animation:frJ .3s ease-out}
.cv-coupA{animation:frA .3s ease-out}

/* 7 · Le Siège */
.sg-boss{display:flex;gap:12px;align-items:flex-start;background:rgba(24,20,40,.78);border:1px solid var(--trait);border-radius:12px;padding:8px;flex:none}
.sg-boss>.carte{width:78px}
.sg-binfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sg-bnom{font:700 19px var(--titre)}
.sg-pv{height:9px;border-radius:5px;background:#2a2340;overflow:hidden}
.sg-pv i{display:block;height:100%;background:var(--toi);transition:width .4s}
.sg-pv.lui i{background:linear-gradient(90deg,#e59a8a,#e0743a)}
.sg-pvt{font:600 12.5px var(--ui);color:var(--sourd);font-variant-numeric:tabular-nums}
.sg-intent{display:flex;align-items:center;gap:8px;margin-top:2px;padding:6px 9px;border-radius:10px;background:#3a1f2a;border:1px solid var(--lui)}
.sg-intent svg{width:26px;height:26px;flex:none;fill:none;stroke:var(--lui);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sg-intent b{display:block;font:700 16px var(--ui);color:#ffd9d0}
.sg-intent span{font-size:12.5px;color:var(--sourd)}
.sg-intent.garde{background:#1d2a3a;border-color:#8fb4e6}
.sg-intent.garde svg{stroke:#8fb4e6}
.sg-intent.garde b{color:#d6e6ff}
.sg-intent.charge{background:#3a2f18;border-color:var(--or)}
.sg-intent.charge svg{stroke:var(--or-vif)}
.sg-intent.charge b{color:var(--or-vif)}
.sg-intent em{margin-left:auto;font:700 13px var(--ui);font-style:normal;color:var(--toi)}
.sg-eq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;flex:1;min-height:0;align-content:center}
.sg-h{display:flex;flex-direction:column;gap:4px}
.sg-h .carte{width:100%;max-width:92px;align-self:center}
.sg-h.ko{opacity:.35}
.sg-menace{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font:700 20px var(--titre);color:#fff;background:rgba(160,40,30,.88);border-radius:8px;padding:1px 7px;z-index:2}
.sg-geste{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:6px;text-align:left;padding:6px 7px;border-radius:10px;border:1px solid #4a3d78;background:linear-gradient(180deg,#30265a,#231c40)}
.sg-geste i{grid-row:span 2;align-self:center;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--ui);font-style:normal;color:#fff;background:radial-gradient(circle at 35% 30%,#cdb8ff 0,#8363d8 40%,#3d2a7a 100%)}
.sg-geste b{font:600 13.5px/1.1 var(--ui)}
.sg-geste span{font-size:11.5px;color:var(--sourd);line-height:1.15}
.sg-geste[disabled]{filter:grayscale(.8) brightness(.55)}
.sg-geste.fait{border-color:var(--toi)}
.sg-bas{display:flex;align-items:center;gap:10px;flex:none}
.sg-bas .btn{flex:1}
.sg-energie{display:flex;align-items:center;gap:4px}
.sg-energie i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9c8ff 0,#8f6fe0 35%,#4a3490 75%,#2a1d55 100%)}
.sg-energie i.vide{background:#241e38;box-shadow:inset 0 0 0 1px #3a3257}
.sg-energie span{font:600 13px var(--ui);color:var(--mauve-clair);margin-left:4px}

/* 8 · Les Trois Terres */
.tt-terres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;flex:1;min-height:0;align-content:start}
.tt-terre{display:flex;flex-direction:column;gap:4px;border-radius:11px;padding:4px;background:rgba(24,20,40,.55);border:2px solid transparent}
.tt-terre.pj{border-color:rgba(127,208,176,.55)}
.tt-terre.pa{border-color:rgba(229,154,138,.55)}
.tt-terre.ok{border-color:var(--or-vif);background:rgba(58,44,102,.6);cursor:pointer}
.tt-terre.non{opacity:.5}
.tt-camp{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.tt-camp .carte{width:100%;cursor:pointer}
.tt-place{aspect-ratio:4/5;border-radius:7px;border:1px dashed #2e2748}
.tt-place.hors{border-color:transparent}
.tt-attente{outline:2px dashed var(--or-vif);outline-offset:-2px}
.tt-plaque{border-radius:9px;background:linear-gradient(180deg,#2d2350,#1f1938);border:1px solid var(--or-filet);padding:5px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}
.tt-plaque h3{margin:0;font:700 14px/1.1 var(--titre);text-wrap:balance}
.tt-plaque p{margin:0;font-size:11px;line-height:1.15;color:var(--sourd);text-wrap:balance}
.tt-plaque .tt-ferme{color:#bfe3f2;text-transform:uppercase;font-weight:600}
.tt-score{display:flex;align-items:center;justify-content:center;gap:5px;font:700 22px var(--titre);font-variant-numeric:tabular-nums}
.tt-score .j{color:var(--toi)} .tt-score .a{color:var(--lui)}
.tt-score i{font:600 9.5px/1 var(--ui);font-style:normal;color:var(--pale);text-transform:uppercase;letter-spacing:.03em;max-width:42px}
.tt-score .mene{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.tt-info{min-height:36px;font-size:13.5px;color:var(--sourd);text-align:center;display:flex;align-items:center;justify-content:center;flex:none;text-wrap:balance}
.tt-main{display:flex;gap:5px;overflow-x:auto;padding:10px 2px 4px;flex:none}
.tt-main .carte{width:58px;cursor:pointer;transition:transform .15s}
.tt-bas{display:flex;align-items:center;gap:10px;flex:none}
.tt-bas .btn{flex:1}

/* Le moteur des créatures : cartes, panneau d'actions, cibles */
.cr2{position:relative;display:flex;flex-direction:column;gap:2px;width:100%;min-width:0;cursor:pointer;border-radius:9px;padding:3px;transition:background .15s}
.cr2 .carte{width:100%}
.cr2.j .carte{border-color:var(--toi)}
.cr2.a .carte{border-color:var(--lui)}
.cr2.sel{background:rgba(241,210,138,.18);box-shadow:0 0 0 2px var(--or-vif)}
.cr2.ko{opacity:.35}
.cr2.ciblable{background:rgba(127,208,176,.2);box-shadow:0 0 0 3px var(--toi);animation:brille 1s ease-in-out infinite}
.cr2-stade{position:absolute;left:3px;top:4px;min-width:20px;height:18px;padding:0 4px;border-radius:5px;background:rgba(10,8,16,.88);color:var(--or-vif);font:700 11px/18px var(--titre);text-align:center;z-index:2}
.cr2-plan{position:absolute;left:2px;right:2px;bottom:3px;border-radius:5px;background:rgba(58,44,102,.95);color:#fff;font:700 10.5px/1.15 var(--ui);text-align:center;padding:2px 1px;z-index:2}
.cr2-nom{font:600 12px/1.1 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.cr2-pv{height:6px;border-radius:3px;background:#2a2340;overflow:hidden}
.cr2-pv i{display:block;height:100%;background:var(--toi);transition:width .25s}
.cr2.a .cr2-pv i{background:var(--lui)}
.cr2-chiffres{font:600 11px var(--ui);color:var(--sourd);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.cr2-statuts{font:600 10px/1.15 var(--ui);color:var(--mauve-clair);text-align:center}
.cr2.petit .cr2-chiffres,.cr2.petit .cr2-statuts{font-size:9.5px}
.pn{flex:none;background:rgba(24,20,40,.9);border:1px solid var(--trait);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:64px}
.pn-titre{font:600 14px var(--ui);color:var(--or-vif);text-align:center}
.pn-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.pn-btn{display:flex;flex-direction:column;gap:1px;align-items:flex-start;text-align:left;padding:7px 8px;border-radius:10px;border:1px solid #4a3d78;background:linear-gradient(180deg,#30265a,#231c40)}
.pn-btn b{font:700 14px/1.1 var(--ui)}
.pn-btn span{font-size:11.5px;line-height:1.15;color:var(--sourd)}
.pn-btn[disabled]{filter:grayscale(.8) brightness(.5)}
.pn-btn.or{background:linear-gradient(180deg,var(--or-vif),var(--or));border-color:var(--or);color:var(--sur-or)}
.pn-btn.or span{color:#5a4318}
.pn-annuler{align-self:center;background:none;border:none;color:var(--sourd);font-size:13px;text-decoration:underline;padding:2px}
.jl{flex:none;min-height:20px;font-size:13px;color:var(--sourd);text-align:center}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pts{display:flex;align-items:center;gap:6px}

/* ——— Les huit concepts ——— */
.cr2.petit .cr2-chiffres{white-space:normal;line-height:1.15}
/* territoires (1, 4, 7) */
.ch-pres{flex:none;text-align:center;font:600 13.5px var(--ui);color:var(--mauve-clair)}
.ch-terres,.ri-terres{flex:1;min-height:0;align-items:stretch}
.ch-terre{display:flex;flex-direction:column;gap:4px;background:rgba(24,20,40,.55);border:1px solid var(--trait);border-radius:11px;padding:4px;min-width:0}
.ch-camp{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;align-content:start;min-height:56px}
.ch-terre>.ch-camp:first-child{align-content:end}
.ch-nom{border-radius:8px;background:linear-gradient(180deg,#2d2350,#1f1938);border:1px solid var(--or-filet);text-align:center;padding:4px 2px;display:flex;flex-direction:column;gap:1px;cursor:pointer}
.ch-nom b{font:700 12.5px/1.1 var(--titre)}
.ch-nom span{font:600 11px var(--ui);color:var(--pale)}
.ch-nom span.j{color:var(--toi)} .ch-nom span.a{color:var(--lui)}
.ch-nom.ciblable{box-shadow:0 0 0 3px var(--toi);background:rgba(127,208,176,.25)}
/* 2 · Mythe contre Mythe */
.my-eq{flex:none;display:flex;flex-direction:column;gap:4px}
.my-rang{display:flex;gap:8px;justify-content:center;align-items:flex-end;min-height:30px;position:relative;padding-left:16px}
.my-rang .cr2{width:92px}
.my-rang.arriere .cr2{width:78px}
.my-lib{position:absolute;left:0;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:center;font:600 9.5px var(--ui);color:var(--pale);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;width:14px}
.my-eveil{height:4px;border-radius:2px;background:#2a2340;overflow:hidden}
.my-eveil i{display:block;height:100%;background:var(--mauve-clair);transition:width .25s}
.my-draft{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.my-offre{display:flex;gap:6px;align-items:flex-start;text-align:left;padding:5px;border-radius:10px;border:1px solid var(--trait);background:var(--nuit2)}
.my-offre .carte{width:46px}
.my-offre.pris{border-color:var(--or-vif);background:#2d2350;box-shadow:0 0 0 1px var(--or-vif)}
.my-otxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.my-otxt b{font:600 12.5px/1.1 var(--ui)}
.my-otxt span{font-size:11px;line-height:1.2;color:var(--sourd)}
.my-syn{background:rgba(24,20,40,.8);border:1px solid var(--trait);border-radius:10px;padding:8px;font-size:12.5px;color:var(--sourd);display:flex;flex-direction:column;gap:3px}
.my-syn b{color:var(--or-vif);font-weight:600}
.my-syn .ok{color:var(--toi)}
/* 3 · Guerre des Royaumes */
.gr-sanct{flex:none;display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 8px;border-radius:10px;background:rgba(24,20,40,.85);border:1px solid var(--trait)}
.gr-sanct b{font:600 13px var(--ui);white-space:nowrap}
.gr-sanct.a b{color:var(--lui)} .gr-sanct.j b{color:var(--toi)}
.gr-pv{flex:1;height:9px;border-radius:5px;background:#2a2340;overflow:hidden}
.gr-pv i{display:block;height:100%;background:var(--toi);transition:width .3s}
.gr-sanct.a .gr-pv i{background:var(--lui)}
.gr-mainA{color:var(--pale);font-size:11px;white-space:nowrap}
.gr-grille{flex:1;min-height:250px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:4px}
.gr-case{border-radius:8px;border:1px dashed #2e2748;background:rgba(15,12,24,.5);display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;padding:2px}
.gr-case.maisonJ{background:rgba(127,208,176,.08)} .gr-case.maisonA{background:rgba(229,154,138,.08)}
.gr-case.ciblable{border:2px solid var(--toi);background:rgba(127,208,176,.22)}
.gr-case .cr2{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:4px;align-items:center;padding:1px}
.gr-case .cr2 .carte{grid-row:span 4;width:34px}
.gr-case .cr2-nom{text-align:left;font-size:11px}
.gr-case .cr2-chiffres,.gr-case .cr2-statuts{text-align:left;font-size:9.5px}
.gr-case .cr2-plan{font-size:8px;padding:1px 0}
.gr-case .cr2-stade{font-size:9px;min-width:14px;height:14px;line-height:14px;padding:0 2px}
.gr-main{display:flex;gap:5px;overflow-x:auto;flex:none;padding-top:8px}
.gr-main .carte{width:48px;cursor:pointer;transition:transform .15s}
.gr-cl{position:absolute;left:0;right:0;bottom:0;font:700 9px var(--ui);text-align:center;background:rgba(10,8,16,.88);padding:1px 0}
/* 4 · Le Rituel */
.ri-rites{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.ri-bloc{border-radius:9px;padding:4px 5px;background:rgba(24,20,40,.88);border:1px solid var(--trait);display:flex;flex-direction:column;gap:2px;font-size:10.5px;min-width:0}
.ri-bloc.a{border-color:rgba(229,154,138,.45)} .ri-bloc.j{border-color:rgba(127,208,176,.45)} .ri-bloc.ko{opacity:.4}
.ri-tete{display:flex;align-items:center;gap:5px;min-width:0}
.ri-tete .carte{width:24px}
.ri-tete b{font:600 12px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-cd{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:4px;color:var(--sourd);line-height:1.15}
.ri-cd em{font-style:normal;font-weight:700;color:var(--ivoire);font-variant-numeric:tabular-nums}
.ri-bar{grid-column:span 2;height:3px;border-radius:2px;background:#2a2340;overflow:hidden;margin-top:1px}
.ri-bar i{display:block;height:100%;background:var(--mauve-clair)}
.ri-cd.fait{color:var(--toi)} .ri-cd.fait .ri-bar i{background:var(--toi)}
.ri-ess{color:var(--or-vif);font-weight:600}
/* 5 · Destins croisés, 6, 8 */
.de-jauge{flex:none;display:flex;flex-direction:column;gap:3px;padding:5px 8px;border-radius:10px;background:rgba(24,20,40,.85);border:1px solid var(--trait)}
.de-lig{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
.de-lig b{font:600 13px var(--ui)}
.de-jauge.j b{color:var(--toi)} .de-jauge.a b{color:var(--lui)}
.de-val{font:700 16px var(--titre);color:var(--or-vif)}
.de-pal{margin-left:auto;color:var(--sourd);font-size:11.5px;text-align:right}
.de-cases{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.de-cases i{height:12px;border-radius:3px;background:#2a2340}
.de-cases i.palier{box-shadow:inset 0 0 0 1px var(--or-filet)}
.de-cases i.plein{background:linear-gradient(180deg,#cdb8ff,#7a5cc8)}
.de-eq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:none}
.de-eq .cr2{max-width:108px;justify-self:center}
.ce-style{flex:none;text-align:center;font-size:13px;color:var(--mauve-clair)}
.ce-xp{display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--or-vif);text-align:center}
.ce-bar{height:4px;border-radius:2px;background:#2a2340;overflow:hidden}
.ce-bar i{display:block;height:100%;background:var(--or-vif)}
.ce-xp em{font-style:normal;color:var(--toi)}
/* 6 · Chasse au monstre */
.ca-boss{flex:none;display:flex;gap:10px;align-items:stretch;background:rgba(58,24,20,.55);border:1px solid rgba(229,154,138,.4);border-radius:12px;padding:8px}
.ca-img{width:84px;align-self:center}
.ca-parts{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.ca-part{border-radius:9px;padding:5px 7px;background:rgba(24,20,40,.88);border:1px solid var(--trait);display:flex;flex-direction:column;gap:2px;cursor:pointer}
.ca-part b{font:600 13px var(--ui)}
.ca-part span{font-size:11px;color:var(--sourd);line-height:1.15}
.ca-part em{font-style:normal;font-size:10.5px;color:var(--mauve-clair)}
.ca-part .cr2-pv i{background:var(--lui)}
.ca-part.ko{opacity:.4}
.ca-part.ciblable{box-shadow:0 0 0 3px var(--toi);background:rgba(127,208,176,.18)}
.ca-int{flex:none;display:flex;flex-direction:column;gap:2px;padding:6px 10px;border-radius:10px;background:#3a1f2a;border:1px solid var(--lui);font-size:13px}
.ca-int b{color:#ffd9d0;font-weight:600} .ca-int span{color:var(--ivoire)}
/* 7 · Reliques */
.rq-rel{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.rq-une{border-radius:9px;padding:5px;background:rgba(24,20,40,.88);border:1px solid var(--or-filet);display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;font-size:10.5px}
.rq-une svg{width:18px;height:18px;fill:var(--or-vif)}
.rq-une b{font:700 12.5px var(--titre)}
.rq-une span{color:var(--sourd);line-height:1.15}
.rq-une em{font-style:normal;font-weight:600;color:var(--pale)}
.rq-une.j{border-color:var(--toi)} .rq-une.j em{color:var(--toi)}
.rq-une.a{border-color:var(--lui)} .rq-une.a em{color:var(--lui)}
.rq-tenir{grid-column:1/-1;text-align:center;font-size:12.5px;color:var(--mauve-clair)}
.rq-porte{font:700 9.5px var(--ui);color:var(--sur-or);background:var(--or-vif);border-radius:4px;text-align:center;padding:1px 2px}
.ch-camp .cr2 .carte{width:82%;align-self:center}
.ch-terres,.ri-terres{overflow-y:auto}

/* ——— Stratégie avant le combat : le socle ——— */
.sp-haut{flex:none}
.sp-adv{font-size:13px;color:var(--mauve-clair);text-align:center;text-wrap:balance}
.sp-msg{min-height:36px;font:600 14px/1.25 var(--ui);color:var(--ivoire);text-align:center;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.sp-corps{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.sp-bas{flex:none;display:flex;flex-direction:column;gap:6px}
.sp-go{align-items:center;text-align:center;padding:12px}
.sp-go b{font-size:17px}
.sp-bloc{background:rgba(24,20,40,.8);border:1px solid var(--trait);border-radius:11px;padding:7px;display:flex;flex-direction:column;gap:6px}
.sp-tit{font:600 13px var(--ui);color:var(--or-vif);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp-tit small{font-weight:500;color:var(--sourd);font-size:12px}
.sp-reserve{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
.sp-hero{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;border-radius:9px;border:1px solid var(--trait);background:var(--nuit2)}
.sp-hero .carte{width:44px}
.sp-hero b{font:600 11px/1.1 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sp-hero span{font-size:9.5px;color:var(--sourd)}
.sp-hero.pris{border-color:var(--or-vif);background:#2d2350}
.sp-hero em{position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--or-vif);color:var(--sur-or);font:700 11px/18px var(--ui);font-style:normal}
.sp-sel{font:600 12.5px var(--ui);color:var(--ivoire);background:#231c40;border:1px solid #4a3d78;border-radius:8px;padding:5px 6px;max-width:100%}
.sp-ligne{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px}
.sp-ligne .carte{width:34px}
.sp-ligne b{font:600 13px var(--ui);min-width:70px}
.sp-res{border-radius:12px;padding:8px 10px;background:rgba(24,20,40,.92);border:1px solid var(--lui)}
.sp-res.gagne{border-color:var(--toi)}
.sp-res h3{margin:0 0 4px;font:700 20px var(--titre)}
.sp-res.gagne h3{color:var(--toi)} .sp-res.perdu h3{color:var(--lui)}
.sp-recit{margin:0;padding-left:18px;font-size:13px;color:var(--ivoire);display:flex;flex-direction:column;gap:2px}
.sp-choix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sp-vs{font:600 11px var(--ui);color:var(--pale);text-transform:uppercase;letter-spacing:.14em;text-align:center}
.sp-rang{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sp-rang .cr2{width:78px}
/* une grille générique (échiquier, figure, éléments, carte, repaire) */
.sp-grille{display:grid;gap:3px;align-self:center;width:min(100%,360px)}
.sp-cell{aspect-ratio:1;border-radius:6px;background:rgba(15,12,24,.6);border:1px solid #2a2342;position:relative;display:grid;place-items:center;overflow:visible;padding:0;min-width:0}
.sp-cell.j{background:rgba(127,208,176,.07)} .sp-cell.a{background:rgba(229,154,138,.07)}
.sp-cell.ok{border-color:var(--or-vif);background:rgba(58,44,102,.5)}
.sp-cell.ciblable{border:2px solid var(--toi);background:rgba(127,208,176,.2)}
.sp-pion{position:absolute;inset:6%;border-radius:50%;overflow:hidden;border:2px solid var(--toi);background:#111}
.sp-pion.a{border-color:var(--lui)}
.sp-pion img{width:100%;height:100%;object-fit:cover}
.sp-pion.ko{opacity:.25}
.sp-pion.chef{box-shadow:0 0 0 2px var(--or-vif)}
.sp-pv{position:absolute;left:8%;right:8%;bottom:-2px;height:4px;border-radius:2px;background:#2a2340;overflow:hidden;z-index:2}
.sp-pv i{display:block;height:100%;background:var(--toi)}
.sp-pv.a i{background:var(--lui)}
.sp-tag{position:absolute;top:-4px;right:-3px;z-index:3;font:700 9px/1 var(--ui);color:var(--sur-or);background:var(--or-vif);border-radius:4px;padding:2px 3px}

function flotXY(x, y, txt, sorte = "") { const f = h("div", "flot " + sorte, txt); f.style.left = x + "px"; f.style.top = y + "px"; $("#flots").append(f); setTimeout(() => f.remove(), 1000); }
function flotSur(el, txt, sorte = "", dy = 0.4) { if (!el) return; const r = el.getBoundingClientRect(); flotXY(r.left + r.width / 2, r.top + r.height * dy, txt, sorte); }

// ─────────────────────────── Le guide : il montre quoi toucher ───────────────────────────
const Guide = (() => {
  let conf = null, fin = null, raf = 0, saute = false;
  const racine = $("#guide");
  const murs = [0, 1, 2, 3].map(() => h("div", "mur"));
  const anneau = h("div", "anneau"), doigt = h("div", "doigt"), bulle = h("div", "bulle"), passer = h("button", "passer", "Passer le tuto");
  doigt.innerHTML = `<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="9" fill="#f1d28a"/><circle cx="22" cy="22" r="16" fill="none" stroke="#f1d28a" stroke-width="2" opacity=".6"/></svg>`;
  racine.append(...murs, anneau, doigt, bulle, passer);
  const sansCible = () => conf && !conf.cible;
  for (const m of murs) m.addEventListener("click", () => { if (sansCible()) finir(); else rejouer(bulle, "secoue"); });
  bulle.addEventListener("click", () => { if (sansCible()) finir(); });
  passer.addEventListener("click", () => { saute = true; finir(); });
  document.addEventListener("click", e => {
    if (!conf || !conf.cible || conf.signal) return;
    const c = conf.cible();
    if (c && c.contains(e.target)) setTimeout(finir, 0);
  }, true);
  function poser(el, x, y, w, hgt) { Object.assign(el.style, { left: x + "px", top: y + "px", width: Math.max(0, w) + "px", height: Math.max(0, hgt) + "px" }); }
  function boucle() {
    if (!conf) return;
    const W = innerWidth, H = innerHeight;
    const c = conf.cible ? conf.cible() : null;
    let r = c ? c.getBoundingClientRect() : null;
    if (r && (r.width === 0 || r.height === 0)) r = null;
    if (r) {
      const p = 6, x0 = r.left - p, y0 = r.top - p, x1 = r.right + p, y1 = r.bottom + p;
      poser(murs[0], 0, 0, W, y0); poser(murs[1], 0, y1, W, H - y1); poser(murs[2], 0, y0, x0, y1 - y0); poser(murs[3], x1, y0, W - x1, y1 - y0);
      anneau.hidden = false; poser(anneau, x0, y0, x1 - x0, y1 - y0);
      doigt.hidden = conf.doigt === false;
      const pt = conf.point ? conf.point() : { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      doigt.style.left = (pt.x - 14) + "px"; doigt.style.top = (pt.y - 18) + "px";
      const auDessus = conf.bulle === "haut" || (conf.bulle !== "bas" && (r.top + r.bottom) / 2 > H * 0.52);
      if (auDessus) { bulle.style.top = ""; bulle.style.bottom = (H - y0 + 14) + "px"; }
      else { bulle.style.bottom = ""; bulle.style.top = (y1 + 14) + "px"; }
    } else {
      poser(murs[0], 0, 0, W, H); for (let i = 1; i < 4; i++) poser(murs[i], 0, 0, 0, 0);
      anneau.hidden = true; doigt.hidden = true;
      bulle.style.bottom = ""; bulle.style.top = (H * 0.38) + "px";
    }
    raf = requestAnimationFrame(boucle);
  }
  function finir() {
    if (!conf) return;
    conf = null; cancelAnimationFrame(raf); racine.hidden = true;
    const f = fin; fin = null; if (f) f();
  }
  return {
    // o : { cible: () => Element, texte, signal: "clé" (fini par Guide.signal), doigt: false | "tire", bulle: "haut" | "bas" }
    etape(o) {
      if (saute || !Jeu.tuto) return Promise.resolve();
      conf = o; racine.hidden = false;
      bulle.innerHTML = ""; bulle.append(h("span", "", o.texte));
      if (!o.cible) bulle.append(h("small", "", "Touche pour continuer"));
      doigt.className = "doigt" + (o.doigt === "tire" ? " tire" : "");
      cancelAnimationFrame(raf); boucle();
      return new Promise(r => { fin = r; });
    },
    signal(cle) { if (conf && conf.signal === cle) finir(); },
    cibleCourante() { return conf && conf.cible ? conf.cible() : null; },
    actif(cle) { return !!conf && (!cle || conf.signal === cle); },
    arreter() { saute = false; finir(); },
    get saute() { return saute; },
  };
})();

        grille.innerHTML = "";
        st.cases.forEach((c, i) => {
          const cell = h("button", "c3-case"); cell.dataset.i = i;
          if (c) {
            const v = valeurs(st, i), b = chiffresDe(c.id, c.s);
            const etat = h("div", "cc-etat");
            if (protegee(st, i, false)) etat.innerHTML = glyphe("rempart", "cc-bouclier");
            const e = carte(c, { camp: c.camp, ch: v, plus: v.map((x, k) => x > b[k]), moins: v.map((x, k) => x < b[k]), etat, cls: (anim.pose === i ? "pose" : "") + (anim.retour === i ? " retourne" : "") });
            e.onclick = () => infoCarte(c);
            cell.append(e);
          } else if (st.bloc.includes(i)) { cell.classList.add("gouffre"); cell.append(h("span", "", "gouffre")); }
          else {
            if (st.terres[i]) { const t = TYPES[st.terres[i]]; cell.classList.add("terre"); cell.style.setProperty("--t", t.c); cell.innerHTML = etoile("", 8, 0.3); cell.append(h("span", "", `${t.nom} +1`)); }
            const g = st.gel[i]; if (g && g.jusqua >= st.tour + 1) { cell.classList.add("gelee"); const s = h("span", "c3-gelee"); s.innerHTML = glyphe("gel"); cell.append(s); }

          e.onclick = () => { if (tour !== "j" || occupe) return fiche(c); sel = sel === k ? null : k; rendre(); if (sel != null) { infoCarte(c); ctx.consigne("Touche une case libre"); } else ctx.consigne("À toi : choisis une carte"); };
          zJ.append(e);
        });
      }
      function trait(de, vers) {
        const [l1, c1, l2, c2] = [Math.floor(de / n), de % n, Math.floor(vers / n), vers % n];
        const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
        ln.setAttribute("x1", c1 + .5); ln.setAttribute("y1", l1 + .5); ln.setAttribute("x2", c2 + .5); ln.setAttribute("y2", l2 + .5);
        svg.append(ln); setTimeout(() => ln.remove(), 2600);
      }
      async function animer(camp, ev, i) {
        const flips = ev.filter(e => e.t === "flip" || e.t === "anubis");
        for (const f of flips.slice().reverse()) st.cases[f.vers].camp = f.prev;
        rendre({ pose: i });
        await dodo(420); if (!ctx.vivant()) return false;

          if (e.t === "protege") { flotSur(cel(e.i), e.id === "kitsune" ? "esquive !" : "Rempart !", "mot", 0.15); await dodo(300); }

          }

        rendre();
        if (!ev.some(e => e.t === "pouvoir")) message(`${camp === "j" ? "Tu retournes" : "Il retourne"} ${nf} carte${nf > 1 ? "s" : ""}.`);
        return true;
      }
      async function jouerJ(i) {
        if (sel == null || tour !== "j" || occupe || !casesPour(st, "j").includes(i)) return;
        occupe = true; const k = sel; sel = null;
        const ev = jouerCoup(st, "j", [k, i]);
        if (!(await animer("j", ev, i))) return;

      }
      async function tourIA() {
        tour = "a"; occupe = true; ctx.consigne("Il réfléchit…", "lui"); rendre();
        await dodo(650); if (!ctx.vivant()) return;

      }
      function suite(qui) {
        if (plein(st) || (!st.main.j.length && !st.main.a.length)) {
          const j = compte(st, "j"), a = compte(st, "a");
          rendre(); ctx.consigne(j > a ? "Gagné !" : j < a ? "Perdu" : "Égalité", j >= a ? "" : "lui");
          return setTimeout(() => ctx.fin({ titre: j > a ? "Victoire" : j < a ? "Défaite" : "Égalité", texte: `${j} cartes à toi, ${a} à lui, contre ${ad.nom} (${NIVEAUX[ad.niveau]}).`, gagne: j > a }), 1000);

  enregistrer({ groupe: "carre", id: "carre-v1", num: "v2", nom: "Le Carré des astres", accroche: "3×3, tes decks, des pouvoirs, 3 niveaux d'ordinateur, un événement 4×4.", duree: "1 min", images: ["thor-2", "yeti-1", "bahamut-3"], fond: "linear-gradient(160deg,#2a2150,#171229)", lancer,
    moteur: { poser, jouerCoup, coups, coupIA, compte, cloner, chiffresDe, plein, ADVERSAIRES, DECK_DEPART, RENFORTS, poidsDeck, poids, POUV, ADV_TYPES: Object.keys(ADV) } });
})();

// ═════════════════════════════ 1 · LE CARRÉ DES ASTRES ═════════════════════════════
// Une grille 3×3. Chaque carte a un chiffre par côté. Pose une carte à côté d'une des siennes :
// si ton chiffre est plus grand, sa carte devient à toi — et elle attaque à son tour ses voisines.
(function () {
  const COTES = ["h", "d", "b", "g"];            // haut, droite, bas, gauche
  const OPP = { h: 2, d: 3, b: 0, g: 1 };        // le côté d'en face, en indice
  const MODELES = { frappeur: [9, 6, 4, 3], garde: [6, 6, 6, 5], appui: [8, 5, 5, 4], sbire: [5, 4, 3, 2] };
  function chiffres(id) {
    const rng = rngDe(hacher("carre-" + id)), f = FICHES[id];
    const t = [...(MODELES[f.role] || MODELES.appui)];
    const rot = Math.floor(rng() * 4);
    const r = t.map((_, i) => t[(i + rot) % 4]);
    const a = Math.floor(rng() * 4), b = (a + 1 + Math.floor(rng() * 3)) % 4;
    if (r[a] < 9 && r[b] > 2) { r[a]++; r[b]--; }
    return r;
  }
  function voisins(i) {
    const l = Math.floor(i / 3), c = i % 3, v = [];
    if (l > 0) v.push([i - 3, 0]); if (c < 2) v.push([i + 1, 1]); if (l < 2) v.push([i + 3, 2]); if (c > 0) v.push([i - 1, 3]);
    return v; // [voisin, mon côté]
  }
  function effectifs(st, id, i) { const b = st.terres[i] && st.terres[i] === typeDe(id) ? 1 : 0; return chiffres(id).map(x => Math.min(10, x + b)); }
  function poser(st, camp, id, i) {
    st.cases[i] = { id, camp, ch: effectifs(st, id, i), bonus: st.terres[i] === typeDe(id) };
    const retours = [], file = [i];
    while (file.length) {
      const k = file.shift(), c = st.cases[k];
      for (const [n, s] of voisins(k)) {
        const v = st.cases[n];
        if (!v || v.camp === c.camp) continue;
        if (c.ch[s] > v.ch[OPP[COTES[s]]]) { v.camp = c.camp; retours.push({ de: k, vers: n, a: c.ch[s], b: v.ch[OPP[COTES[s]]], chaine: k !== i }); file.push(n); }
      }
    }
    return retours;
  }
  const compte = (st, camp) => st.cases.filter(c => c && c.camp === camp).length + st.main[camp].length;
  const cloner = st => ({ terres: st.terres, cases: st.cases.map(c => c && { ...c }), main: { j: [...st.main.j], a: [...st.main.a] } });
  function coupIA(st, rng) {
    let best = null;
    const libres = st.cases.map((c, i) => c ? -1 : i).filter(i => i >= 0);
    for (const id of new Set(st.main.a)) for (const i of libres) {
      const s = cloner(st); s.main.a.splice(s.main.a.indexOf(id), 1); poser(s, "a", id, i);
      let pire = compte(s, "a") - compte(s, "j");
      const libres2 = libres.filter(x => x !== i);
      for (const id2 of new Set(s.main.j)) for (const i2 of libres2) {
        const s2 = cloner(s); s2.main.j.splice(s2.main.j.indexOf(id2), 1); poser(s2, "j", id2, i2);
        pire = Math.min(pire, compte(s2, "a") - compte(s2, "j"));
      }
      const v = pire + rng() * 0.6;
      if (!best || v > best.v) best = { v, id, i };
    }
    return best;
  }

  function lancer(ctx) {
    const rng = rngDe(Date.now() % 1e9);
    const tuto = Jeu.tuto;
    let mainJ, mainA, terres = {};
    if (tuto) {
      mainJ = ["thor", "yeti", "ifrit", "kitsune", "bahamut"]; mainA = ["draugr", "oni", "fenrir", "cerbere", "anansi"];
      terres = { 8: "feu" };
    } else {
      const pool = melanger([...HEROS_TYPES.map(x => x.id)], rng);
      mainJ = pool.slice(0, 5); mainA = pool.slice(5, 9).concat([SBIRES[Math.floor(rng() * SBIRES.length)].id]);
      melanger(mainA, rng);
      const cs = melanger([0, 1, 2, 3, 4, 5, 6, 7, 8], rng);
      const ty = melanger(Object.keys(ADV), rng);
      terres[cs[0]] = ty[0]; terres[cs[1]] = ty[1];
    }
    const st = { cases: Array(9).fill(null), main: { j: mainJ, a: mainA }, terres };
    const premier = tuto ? "a" : (statsDe("carre").p % 2 ? "a" : "j");
    let tour = premier, sel = null, occupe = false;

    const zoneA = h("div", "cr-main cr-a"), plateau = h("div", "cr-plateau"), zoneJ = h("div", "cr-main cr-j");
    ctx.scene.append(zoneA, plateau, zoneJ);

    function elCarte(id, camp, o = {}) {
      const e = vignette(id, { nom: o.nom !== false });
      e.classList.add("cr-carte");
      if (camp) e.classList.add("c" + camp);
      const ch = o.ch || chiffres(id);
      COTES.forEach((s, k) => { const n = h("span", "cr-n cr-" + s, ch[k] === 10 ? "A" : ch[k]); if (o.bonus) n.classList.add("plus"); e.append(n); });
      return e;
    }
    function rendre(anim = {}) {
      ctx.scoreJA(compte(st, "j"), compte(st, "a"));
      zoneA.innerHTML = "";
      st.main.a.forEach(id => zoneA.append(elCarte(id, null, { nom: false })));
      plateau.innerHTML = "";
      st.cases.forEach((c, i) => {
        const cell = h("button", "cr-case"); cell.dataset.i = i;
        if (c) {
          const e = elCarte(c.id, c.camp, { ch: c.ch, bonus: c.bonus, nom: false });
          if (anim.pose === i) e.classList.add("cr-pose");
          if (anim.retour === i) e.classList.add("retourne");
          cell.append(e);
        } else {
          if (st.terres[i]) {
            const t = TYPES[st.terres[i]]; cell.classList.add("cr-terre"); cell.style.setProperty("--t", t.c);
            cell.innerHTML = etoile("", 8, 0.3); cell.append(h("span", "", `${t.nom} +1`));
          }
          if (sel && tour === "j") cell.classList.add("cr-libre");
          cell.onclick = () => jouerJ(i);
        }
        plateau.append(cell);
      });
      zoneJ.innerHTML = "";
      st.main.j.forEach(id => {
        const e = elCarte(id, null); e.dataset.id = id;
        if (sel === id) e.classList.add("choisie");
        e.onclick = () => { if (tour !== "j" || occupe) return; sel = sel === id ? null : id; rendre(); if (sel) ctx.consigne("Touche une case vide"); else ctx.consigne("À toi : touche une carte"); };
        zoneJ.append(e);
      });
    }
    async function jouer(camp, id, i) {
      occupe = true;
      st.main[camp].splice(st.main[camp].indexOf(id), 1);
      const retours = poser(st, camp, id, i);
      // on remet les cartes retournées à leur ancien camp, pour les montrer basculer une à une
      for (const r of retours) st.cases[r.vers].camp = autre(camp);
      rendre({ pose: i });
      await dodo(420); if (!ctx.vivant()) return;
      for (const r of retours) {
        const A = plateau.children[r.de].getBoundingClientRect(), B = plateau.children[r.vers].getBoundingClientRect();
        flotXY((A.left + A.right + B.left + B.right) / 4, (A.top + A.bottom + B.top + B.bottom) / 4, `${r.a} › ${r.b}`, "or");
        await dodo(260); if (!ctx.vivant()) return;
        st.cases[r.vers].camp = camp;
        rendre({ retour: r.vers });
        if (r.chaine) flotSur(plateau.children[r.vers], "en chaîne !", "mot", 0.1);
        await dodo(380); if (!ctx.vivant()) return;
      }
      occupe = false;
      return retours;
    }
    async function jouerJ(i) {
      if (!sel || tour !== "j" || occupe || st.cases[i]) return;
      const id = sel; sel = null;
      const r = await jouer("j", id, i);
      if (!ctx.vivant()) return;
      apres(r);
    }
    async function tourIA(force) {
      tour = "a"; ctx.consigne("Il réfléchit…", "lui"); rendre();
      await dodo(700); if (!ctx.vivant()) return;
      const c = force || coupIA(st, rng);
      await jouer("a", c.id, c.i);
      if (!ctx.vivant()) return;
      apres();
    }
    let finie = false;
    async function apres(r) {
      if (st.cases.every(Boolean)) return terminer();
      if (tour === "j") { if (!tuto || tutoFini) tourIA(); else if (r) suiteTuto(r); }
      else { tour = "j"; ctx.consigne("À toi : touche une carte"); rendre(); }
    }
    function terminer() {
      if (finie) return; finie = true;
      const j = compte(st, "j"), a = compte(st, "a");
      rendre(); ctx.consigne(j > a ? "Gagné !" : j < a ? "Perdu" : "Égalité", j >= a ? "" : "lui");
      setTimeout(() => ctx.fin({ titre: j > a ? "Victoire" : j < a ? "Défaite" : "Égalité", texte: `${j} cartes à ta couleur, ${a} à la sienne.`, gagne: j > a }), 900);
    }

    // ——— le tuto : Jeu.tuto est vrai tant qu'on ne l'a pas fini une fois ———
    let tutoFini = !tuto;
    async function suiteTuto(r) {
      const f = r && r[0];
      if (f) await ctx.etape({ texte: `Ton ${f.a} bat son ${f.b} : sa carte est à toi !` });
      await ctx.etape({ texte: "À la fin, le plus de cartes gagne." });

// ═════════════════════════════ 2 · LE PALET DES LÉGENDES ═════════════════════════════
// Chaque héros est un palet. On le tire vers soi, on vise, on lâche : il glisse vers trois cercles.
// Les palets se cognent. À la fin, dans chaque cercle, la plus grosse force l'emporte : 2 cercles sur 3.
(function () {
  const W = 360, H = 560, R = 22, FROT = 0.982, VMAX = 11, LX = 180, LY = 505, LIGNE = 452;
  const MASSE = { garde: 1.8, appui: 1.1, frappeur: 0.9, sbire: 1.2 };
  const FORCE = { garde: 3, appui: 3, frappeur: 4, sbire: 2 };
  const LANCERS = 4;

  function palet(id, camp) { const r = FICHES[id].role; return { id, camp, x: LX, y: LY, vx: 0, vy: 0, m: MASSE[r] || 1, f: FORCE[r] || 3, dehors: false }; }
  function pas(ps) {
    for (let s = 0; s < 2; s++) {
      for (const p of ps) { if (p.dehors) continue; p.x += p.vx / 2; p.y += p.vy / 2;
        if (p.x < R) { p.x = R; p.vx = -p.vx * 0.75; } if (p.x > W - R) { p.x = W - R; p.vx = -p.vx * 0.75; }
        if (p.y > H - R) { p.y = H - R; p.vy = -p.vy * 0.75; }
        if (p.y < -R) { p.dehors = true; p.vx = p.vy = 0; }
      }
      for (let i = 0; i < ps.length; i++) for (let k = i + 1; k < ps.length; k++) {
        const a = ps[i], b = ps[k]; if (a.dehors || b.dehors) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d >= 2 * R || d === 0) continue;
        const nx = dx / d, ny = dy / d, rec = 2 * R - d, ia = 1 / a.m, ib = 1 / b.m;
        a.x -= nx * rec * ia / (ia + ib); a.y -= ny * rec * ia / (ia + ib); b.x += nx * rec * ib / (ia + ib); b.y += ny * rec * ib / (ia + ib);
        const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vn < 0) { const j = -(1 + 0.9) * vn / (ia + ib); a.vx -= j * ia * nx; a.vy -= j * ia * ny; b.vx += j * ib * nx; b.vy += j * ib * ny; }
      }
    }
    let bouge = false;
    for (const p of ps) { p.vx *= FROT; p.vy *= FROT; if (Math.hypot(p.vx, p.vy) < 0.04) p.vx = p.vy = 0; else bouge = true; }
    return bouge;
  }
  function simuler(ps) { for (let i = 0; i < 1500 && pas(ps); i++); }
  function comptes(ps, terres) {
    return terres.map(t => {
      const s = { j: 0, a: 0 };
      for (const p of ps) if (!p.dehors && Math.hypot(p.x - t.x, p.y - t.y) <= t.r) s[p.camp] += p.f + (typeDe(p.id) === t.type ? 2 : 0);
      return s;
    });
  }
  const gagnes = (cs, camp) => cs.filter(s => s[camp] > s[autre(camp)]).length;
  const distance = v0 => v0 * FROT / (1 - FROT);

  function lancer(ctx) {
    const rng = rngDe(Date.now() % 1e9), tuto = Jeu.tuto;
    const types = melanger(Object.keys(ADV), rng);
    const terres = [{ x: 180, y: 112, r: 58 }, { x: 88, y: 282, r: 60 }, { x: 272, y: 282, r: 60 }];
    terres.forEach((t, i) => t.type = tuto ? ["nature", "feu", "eau"][i] : types[i]);
    let equipeJ, equipeA;
    if (tuto) { equipeJ = ["thor", "golem", "kitsune", "bahamut"]; equipeA = ["fenrir", "cerbere", "oni", "banshee"]; }
    else { const pool = melanger(HEROS_TYPES.map(x => x.id), rng); equipeJ = pool.slice(0, LANCERS); equipeA = pool.slice(LANCERS, 2 * LANCERS - 1).concat([SBIRES[Math.floor(rng() * 6)].id]); melanger(equipeA, rng); }
    const reste = { j: [...equipeJ], a: [...equipeA] };

// ═════════════════════════════ 4 · LE DUEL DES OMBRES ═════════════════════════════
// Cinq cartes chacun, toutes visibles. À chaque manche, une terre donne +2 à un type.
// Vous choisissez une carte en même temps, en secret, et on retourne. La plus forte gagne la manche.

(function () {
  const FORCES = [3, 5, 6, 7, 9];
  function puissance(id, f, terre, contre) {
    const t = typeDe(id), l = [[f, "force"]];
    if (t === terre) l.push([2, "terre"]);
    if (contre && bat(t, typeDe(contre))) l.push([3, "avantage"]);
    return { total: l.reduce((s, x) => s + x[0], 0), lignes: l };
  }
  function lancer(ctx) {
    const rng = rngDe(Date.now() % 1e9), tuto = Jeu.tuto;
    let mainJ, mainA, terres;
    const types = Object.keys(ADV);
    function main(ids) { const f = melanger([...FORCES], rng); return ids.map((id, i) => ({ id, f: f[i] })); }
    if (tuto) {
      mainJ = [{ id: "thor", f: 7 }, { id: "golem", f: 5 }, { id: "ifrit", f: 9 }, { id: "kitsune", f: 6 }, { id: "yeti", f: 3 }];
      mainA = [{ id: "bahamut", f: 6 }, { id: "fenrir", f: 9 }, { id: "anansi", f: 5 }, { id: "cerbere", f: 7 }, { id: "loki", f: 3 }];
      terres = ["foudre", "glace", "feu", "nature", "esprit"];
    } else {

      mainJ = main(pool.slice(0, 5)); mainA = main(pool.slice(5, 10));
      terres = [0, 1, 2, 3, 4].map(() => types[Math.floor(rng() * types.length)]);
    }
    const pts = { j: 0, a: 0 }, double = { j: false, a: false };
    let manche = 0, sel = null, doubler = false, occupe = false, resultat = null;

    const zTerres = h("div", "du-terres"), zA = h("div", "du-main du-a"), arene = h("div", "du-arene"), zJ = h("div", "du-main du-j");
    const bDouble = h("button", "btn mauve", "Doubler ×2"), bOk = h("button", "btn or", "Valider"), zBtn = h("div", "rangee");
    zBtn.append(bDouble, bOk);
    ctx.scene.append(zTerres, zA, arene, zJ, zBtn);

    function rendre() {
      ctx.scoreJA(pts.j, pts.a);
      zTerres.innerHTML = "";
      terres.forEach((t, i) => {
        const e = h("div", "du-terre" + (i === manche ? " ici" : i < manche ? " passee" : ""));
        e.style.setProperty("--t", TYPES[t].c); e.append(h("b", "", `Manche ${i + 1}`), h("span", "", `${TYPES[t].nom} +2`));
        zTerres.append(e);

        if (sel) { const s = mainJ.find(x => x.id === sel); if (bat(typeDe(s.id), typeDe(c.id))) e.append(h("span", "du-fl vert", "tu bats")); else if (bat(typeDe(c.id), typeDe(s.id))) e.append(h("span", "du-fl rose", "te bat")); }
        if (typeDe(c.id) === terre) e.append(h("span", "du-bonus", "+2"));
        zA.append(e);
      });
      zJ.innerHTML = "";
      mainJ.forEach(c => {
        const e = vignette(c.id, { force: c.f }); e.dataset.id = c.id;
        if (typeDe(c.id) === terre) e.append(h("span", "du-bonus", "+2"));
        if (sel === c.id) e.classList.add("choisie");
        e.onclick = () => { if (occupe) return; sel = sel === c.id ? null : c.id; rendre(); };
        zJ.append(e);
      });
      if (!resultat) {
        arene.innerHTML = "";
        arene.append(h("div", "du-vide", sel ? "Valide : il choisit en même temps que toi" : "Choisis ta carte pour cette manche"));

      if (manche < terres.length) ctx.consigne(occupe ? "On retourne…" : `Manche ${manche + 1} : ${TYPES[terre].nom} +2`, occupe ? "calme" : "");
    }

      arene.innerHTML = "";
      const slotA = h("div", "du-slot"), slotJ = h("div", "du-slot");
      slotA.append(dos()); slotJ.append(vignette(cj.id, { force: cj.f }));

    bDouble.onclick = () => { if (double.j || occupe) return; doubler = !doubler; rendre(); };
    rendre();
    if (tuto) (async () => {
      await ctx.etape({ texte: "Choisis une carte. Lui aussi, en secret." });

      await ok; if (!ctx.vivant()) return;
