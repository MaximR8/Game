})();

// ═════════════════════════════ 5 · LA POUSSÉE EN RYTHME ═════════════════════════════
// Trois héros contre trois. Ceux de devant se battent. Quand ton héros frappe, un anneau se resserre :
// touche l'écran quand il touche le cercle (parfait = double dégâts et la ligne avance). Quand il te
// frappe, pare de la même façon. Pousse la ligne jusqu'à sa base.
(function () {
  const RT = 46, RMAX = 150;
  function combattant(id) { const f = FICHES[id]; const pv = Math.round((f.pv || 50) * 0.6); return { id, pv, max: pv, att: f.att || 10 }; }
  function lancer(ctx) {
    const rng = rngDe(Date.now() % 1e9), tuto = Jeu.tuto;
    let eqJ, eqA;
    if (tuto) { eqJ = ["thor", "golem", "kitsune"]; eqA = ["bahamut", "cerbere", "fenrir"]; }
    else { const p = melanger(HEROS_TYPES.map(x => x.id), rng); eqJ = p.slice(0, 3); eqA = p.slice(3, 6); }
    const J = eqJ.map(combattant), A = eqA.map(combattant);
    let L = 5, vitesse = tuto ? 1 : 1.25, fini = false;

    const jauge = h("div", "ry-jauge"), queueA = h("div", "ry-queue"), scene = h("div", "ry-scene"), queueJ = h("div", "ry-queue");
    const posA = h("div", "ry-pos ry-pa"), posJ = h("div", "ry-pos ry-pj"), mot = h("div", "ry-mot");
    scene.append(posA, mot, posJ);
    ctx.scene.append(jauge, queueA, scene, queueJ);

    function rendre() {
      ctx.scoreJA(A.filter(x => x.pv <= 0).length, J.filter(x => x.pv <= 0).length);
      jauge.innerHTML = "";
      const cases = h("div", "ry-cases");
      for (let i = 0; i <= 10; i++) { const c = h("div", "ry-case" + (i === 0 ? " bj" : i === 10 ? " ba" : "")); if (i === L) { c.classList.add("ici"); c.innerHTML = etoile("", 8, 0.3); } cases.append(c); }
      const bords = h("div", "ry-bords"); bords.append(h("span", "j", "Ta base"), h("span", "", L > 5 ? `+${L - 5}` : L < 5 ? `${L - 5}` : "milieu"), h("span", "a", "Sa base"));
      jauge.append(cases, bords);
      const vivA = A.filter(x => x.pv > 0), vivJ = J.filter(x => x.pv > 0);
      queueA.innerHTML = ""; queueA.append(h("span", "ry-lib lui", "Derrière lui"));
      vivA.slice(1).forEach(x => queueA.append(vignette(x.id, { nom: false })));
      queueJ.innerHTML = ""; queueJ.append(h("span", "ry-lib", "Derrière toi"));
      vivJ.slice(1).forEach(x => queueJ.append(vignette(x.id, { nom: false })));
      posA.innerHTML = ""; posJ.innerHTML = "";
      if (vivA[0]) posA.append(carteCombat(vivA[0], "a"));
      if (vivJ[0]) posJ.append(carteCombat(vivJ[0], "j"));
    }
    function carteCombat(x, camp) {
      const w = h("div", "ry-front"), c = vignette(x.id, { camp });
      c.classList.add("ry-carte");
      const pv = h("div", "ry-pv"), i = h("i"); i.style.width = Math.max(0, x.pv / x.max * 100) + "%"; pv.append(i);
      w.append(c, pv, h("div", "ry-stat", `${Math.max(0, x.pv)} PV · ${x.att} ATT · ${TYPES[typeDe(x.id)].nom}`));
      return w;
    }
    // L'anneau : il se resserre sur la carte visée ; on touche quand il épouse le cercle.
    function anneau(cibleEl, duree) {
      return new Promise(res => {
        const rs = scene.getBoundingClientRect(), rc = cibleEl.getBoundingClientRect();
        const cx = rc.left + rc.width / 2 - rs.left, cy = rc.top + rc.height / 2 - rs.top;
        const fixe = h("div", "ry-cible"), mobile = h("div", "ry-anneau");
        for (const [e, r] of [[fixe, RT], [mobile, RMAX]]) Object.assign(e.style, { left: cx + "px", top: cy + "px", width: 2 * r + "px", height: 2 * r + "px" });
        scene.append(fixe, mobile);
        const t0 = performance.now(); let fin = false;
        const rayon = () => RMAX * (1 - (performance.now() - t0) / duree);
        const conclure = r => {
          if (fin) return; fin = true; scene.removeEventListener("pointerdown", tape);

        (function f() { if (fin) return; if (!ctx.vivant()) { fin = true; return; } const r = rayon(); if (r < RT - 26) return conclure(r); mobile.style.width = mobile.style.height = 2 * r + "px"; requestAnimationFrame(f); })();

    }
    function pousser(d) { L = borne(L + d, 0, 10); }
    async function motFort(txt, sorte) { mot.textContent = txt; mot.className = "ry-mot " + sorte; rejouer(mot, "bond"); }
    async function echange() {
      const a = A.find(x => x.pv > 0), j = J.find(x => x.pv > 0);
      // toi, tu frappes

      const guide1 = tuto && !Guide.saute && Jeu.tuto ? ctx.etape({ cible: () => scene, signal: "anneau", doigt: false, bulle: "haut", texte: "Touche quand l'anneau touche le cercle" }) : null;
      const r1 = await anneau(posA.querySelector(".ry-carte"), (guide1 ? 2200 : 1150) / vitesse);
      Guide.signal("anneau"); if (guide1) await guide1;
      if (!ctx.vivant()) return;
      const k = r1 === "parfait" ? 2 : r1 === "bien" ? 1.5 : 1, m = bat(typeDe(j.id), typeDe(a.id)) ? 1.5 : bat(typeDe(a.id), typeDe(j.id)) ? 0.7 : 1;
      const d = Math.round(j.att * k * m);
      motFort(r1 === "parfait" ? "PARFAIT ×2" : r1 === "bien" ? "BIEN ×1,5" : "RATÉ ×1", r1);
      rejouer(posJ.querySelector(".ry-front"), "ry-frappeJ"); await dodo(180);
      flotSur(posA.querySelector(".ry-carte"), `−${d}`, m > 1 ? "gros" : "or"); rejouer(posA.querySelector(".ry-carte"), "secoue");
      a.pv -= d; if (r1 === "parfait") pousser(1);
      if (a.pv <= 0) { pousser(2); await dodo(350); motFort(`${nomDe(a.id)} tombe : +2 cases`, "parfait"); }
      rendre(); await dodo(650); if (!ctx.vivant()) return;
      if (tuto && Jeu.tuto && !Guide.saute) await ctx.etape({ texte: r1 === "parfait" ? "Parfait : double dégâts, la ligne avance !" : "Presque ! Parfait = double dégâts." });
      if (verifier()) return;
      if (a.pv <= 0) return;
      // lui, il te frappe
      ctx.consigne("Pare : touche quand l'anneau touche le cercle", "lui");
      const guide2 = tuto && !Guide.saute && Jeu.tuto ? ctx.etape({ cible: () => scene, signal: "anneau", doigt: false, bulle: "haut", texte: "Il frappe : pare au bon moment !" }) : null;
      const r2 = await anneau(posJ.querySelector(".ry-carte"), (guide2 ? 2200 : 1050) / vitesse);
      Guide.signal("anneau"); if (guide2) await guide2;
      if (!ctx.vivant()) return;
      const m2 = bat(typeDe(a.id), typeDe(j.id)) ? 1.5 : bat(typeDe(j.id), typeDe(a.id)) ? 0.7 : 1;

      motFort(r2 === "parfait" ? "PARADE PARFAITE" : r2 === "bien" ? "PARADE : −50 %" : "TOUCHÉ", r2);
      rejouer(posA.querySelector(".ry-front"), "ry-frappeA"); await dodo(180);
      if (d2) { flotSur(posJ.querySelector(".ry-carte"), `−${d2}`, "rose"); rejouer(posJ.querySelector(".ry-carte"), "secoue"); }
      j.pv -= d2; if (r2 === "rate") pousser(-1);
      if (j.pv <= 0) { pousser(-2); await dodo(350); motFort(`${nomDe(j.id)} tombe : −2 cases`, "rate"); }
      rendre(); await dodo(650); if (!ctx.vivant()) return;
      if (tuto && Jeu.tuto && !Guide.saute) { await ctx.etape({ texte: "Pousse l'étoile jusqu'à sa base !" }); ctx.tutoFini(); }

    }
    function verifier() {
      const vA = A.some(x => x.pv > 0), vJ = J.some(x => x.pv > 0);
      if (L >= 10 || !vA) { fini = true; return ctx.fin({ titre: "Victoire", texte: !vA ? "Toute son équipe est tombée." : "L'étoile a atteint sa base.", gagne: true }), true; }
      if (L <= 0 || !vJ) { fini = true; return ctx.fin({ titre: "Défaite", texte: !vJ ? "Toute ton équipe est tombée." : "L'étoile a atteint ta base.", gagne: false }), true; }

    }
    (async () => {
      rendre();
      if (tuto) await ctx.etape({ texte: "Tes héros se battent. Toi, tu donnes le rythme." });

})();

// ═════════════════════════════ 6 · LA CARAVANE ═════════════════════════════
// Une course : à chaque étape, recrute un héros parmi trois, range ton équipe, et elle se bat seule
// contre une caravane adverse. Deux fois le même héros : il monte d'un niveau. 5 victoires avant 3 défaites.
// En duel, la caravane adverse serait l'équipe enregistrée d'un autre joueur.
(function () {
  const MAX = 5, VICTOIRES = 5, VIES = 3;
  const MULT = [1, 1.5, 2.25];
  function stats(id, niv) {

// ═════════════════════════════ Le moteur des créatures (concepts n1 → n8) ═════════════════════════════

const STADE_PV = [1, 1.35, 1.8], STADE_ATT = [1, 1.3, 1.7];
const KITS = {

  babayaga: { role: "Sorcière", pv: 36, att: 6, pouvoir: "Malédiction", txt: "La cible perd 3 PV par stade chaque tour, et ne peut plus être soignée.", cible: "ennemi" },
  wukong: { role: "Virtuose", pv: 38, att: 8, pouvoir: "Mille singes", txt: "Trois coups à ×0,45 sur la cible.", cible: "ennemi" },
  banshee: { role: "Hurleuse", pv: 36, att: 6, pouvoir: "Le cri", txt: "Tous les adversaires Affaiblis (−30 % de dégâts) pendant 2 tours.", cible: "aucune" },
  minotaure: { role: "Charge", pv: 46, att: 9, pouvoir: "Charge du labyrinthe", txt: "Frappe ×2,2, mais perd 15 % de ses PV.", cible: "ennemi" },
  quetzalcoatl: { role: "Chef", pv: 38, att: 6, pouvoir: "Souffle du vent", txt: "Toute l'équipe +3 ATT par stade pendant 2 tours.", cible: "aucune" },
  doudou: { role: "Protecteur", pv: 54, att: 6, pouvoir: "Crin porte-bonheur", txt: "Protège un allié : les coups qu'il reçoit vont sur El Biète (−30 %).", cible: "allie" },
  cerbere: { role: "Gardien", pv: 52, att: 7, pouvoir: "Trois têtes", txt: "Contre-attaque chaque coup reçu (×0,6) pendant 2 tours, +3 armure par stade.", cible: "soi" },
};
const ROSTER = Object.keys(KITS);
const STATUTS = { mouille: "Mouillé", marque: "Marqué", esquive: "Esquive", gele: "Gelé", saigne: "Saigne", malediction: "Maudit", provoque: "Provoque", affaibli: "Affaibli", buff: "Galvanisé", protege: "Protégé", contre: "Contre" };
let UID = 0;
function creer(id, camp) { const c = { uid: ++UID, id, camp, stade: 1, pv: 0, max: 0, att: 0, armure: 0, defend: false, st: {}, recharge: 0, ko: false, bonusAtt: 0, bonusPv: 0 }; recalc(c); c.pv = c.max; return c; }
function recalc(c) { const k = KITS[c.id]; c.max = Math.round(k.pv * STADE_PV[c.stade - 1]) + c.bonusPv; c.att = Math.round(k.att * STADE_ATT[c.stade - 1]) + c.bonusAtt; }
const forme = c => (FICHES[c.id].formes || [])[c.stade - 1] || nomDe(c.id);
const attaqueDe = c => c.att + (c.st.buff ? c.st.buff.v : 0);
const vivants = l => l.filter(c => !c.ko);
function evoluer(M, c) {
  if (c.stade >= 3 || c.ko) return false;
  c.stade++; recalc(c); c.pv = Math.min(c.max, c.pv + Math.round(c.max * 0.35));
  M.log(`${nomDe(c.id)} évolue : ${forme(c)} !`); M.fx(c, `stade ${["I", "II", "III"][c.stade - 1]}`, "gros");
  M.hook && M.hook("evolution", c);
  return true;
}
function typeMult(a, b) { const ta = typeDe(a.id), tb = typeDe(b.id); return bat(ta, tb) ? 1.5 : bat(tb, ta) ? 0.7 : 1; }
function frapper(M, src, cible, k = 1, o = {}) {
  if (!cible || cible.ko) return 0;
  if (cible.st.protege && !o.contre) { const p = M.tous().find(x => x.uid === cible.st.protege.par && !x.ko); if (p && p !== cible) { M.log(`${nomDe(p.id)} protège ${nomDe(cible.id)}`); cible = p; k *= 0.7; } }
  if (cible.st.esquive) { delete cible.st.esquive; M.fx(cible, "esquive !", "mot"); M.log(`${nomDe(cible.id)} esquive`); return 0; }
  let m = k * typeMult(src, cible);
  if (cible.st.mouille && typeDe(src.id) === "foudre") m *= 2;
  if (cible.st.marque) { m *= 1.5; delete cible.st.marque; }
  if (src.st.affaibli) m *= 0.7;
  if (cible.defend) m *= 0.5;
  if (cible.fragile) m *= cible.fragile;
  let d = Math.max(1, Math.round(attaqueDe(src) * m));
  const a = Math.min(cible.armure, d); cible.armure -= a; d -= a;
  cible.pv -= d;
  M.fx(cible, a && !d ? "bloqué" : `−${d}`, m >= 1.5 ? "or" : "rose");
  M.hook && M.hook("degats", src, cible, d);
  if (cible.pv <= 0) ko(M, cible, src);
  else if (cible.st.contre && !o.contre && !src.ko) frapper(M, cible, src, 0.6, { contre: true });
  return d;
}
function blesser(M, c, n, par) { if (c.ko) return; c.pv -= n; M.fx(c, `−${n}`, "rose"); M.hook && M.hook("degats", par || null, c, n); if (c.pv <= 0) ko(M, c, par || null); }

  const s = Math.min(n, c.max - c.pv); c.pv += s; if (s) { M.fx(c, `+${s}`, "vert"); M.hook && M.hook("soin", c, s); }
  return s;
}
function ko(M, c, par) {
  c.pv = 0; c.ko = true; c.st = {}; c.armure = 0; c.defend = false;
  M.fx(c, "K.O.", "mot"); M.log(`${nomDe(c.id)} tombe`);
  M.hook && M.hook("ko", par, c);
}
function ciblesValides(liste) { const v = vivants(liste), p = v.filter(x => x.st.provoque); return p.length ? p : v; }
// Début du tour d'un camp : dégâts qui durent, statuts qui s'usent, recharge des pouvoirs.
function debutTour(M, camp) {
  for (const c of M.tous().filter(x => x.camp === camp && !x.ko)) {
    c.defend = false;
    if (c.st.saigne) { blesser(M, c, c.st.saigne.v, null); if (c.ko) continue; if (--c.st.saigne.n <= 0) delete c.st.saigne; }

// Le pouvoir de chaque créature. cible : la créature visée (ennemi ou allié), selon KITS[id].cible.
function pouvoir(M, c, cible) {

  switch (c.id) {
    case "thor": { frapper(M, c, cible, 1.5); const autre_ = adv().filter(x => x !== cible)[0]; if (autre_) frapper(M, c, autre_, 0.5); break; }
    case "golem": c.armure += 5 * s; c.st.provoque = 2; break;
    case "bahamut": for (const a of all()) soigner(M, a, 5 * s); for (const e of adv()) e.st.mouille = 3; break;
    case "kitsune": if (cible) cible.st.marque = true; c.st.esquive = true; break;
    case "yeti": frapper(M, c, cible, 0.6); if (!cible.ko) cible.st.gele = true; break;

      const mort = M.allies(c).find(x => x.ko && !x.ranime);

      else { const e = cible || adv()[0]; if (e) { const d = frapper(M, c, e, 1); soigner(M, c, d); } }
      break;
    }
    case "fenrir": frapper(M, c, cible, cible.st.gele ? 1.5 : 1); if (!cible.ko) cible.st.saigne = { v: 3 * s, n: 3 }; break;
    case "babayaga": cible.st.malediction = { v: 3 * s, n: 3 }; M.fx(cible, "maudit", "mot"); break;
    case "wukong": for (let i = 0; i < 3 && !cible.ko; i++) frapper(M, c, cible, 0.45); break;
    case "banshee": for (const e of adv()) e.st.affaibli = 2; break;
    case "minotaure": frapper(M, c, cible, 2.2); blesser(M, c, Math.round(c.max * 0.15), null); break;
    case "quetzalcoatl": for (const a of all()) a.st.buff = { v: 3 * s, n: 2 }; break;
    case "doudou": if (cible) cible.st.protege = { par: c.uid, n: 2 }; break;
    case "cerbere": c.st.contre = 2; c.armure += 3 * s; break;
  }

  M.hook && M.hook("pouvoir", c, cible);
}
// L'IA : ce que vaut un pouvoir maintenant (grossier, mais lisible).
function valeurPouvoir(M, c) {
  const adv = vivants(M.adversaires(c)), all = vivants(M.allies(c));
  switch (c.id) {
    case "anubis": return M.allies(c).some(x => x.ko && !x.ranime) && !c.aRanime ? 9 : 3;
    case "bahamut": return all.reduce((s, a) => s + Math.min(5 * c.stade, a.max - a.pv), 0) / 4 + adv.length;
    case "golem": case "cerbere": return c.pv < c.max * 0.7 ? 5 : 2;
    case "banshee": case "quetzalcoatl": return adv.length + 2;
    case "doudou": return all.some(a => a !== c && a.pv < a.max * 0.5) ? 5 : 1;
    default: return adv.length ? 6 : 0;
  }
}

// ═════════════════════════════ Le socle « stratégie avant le combat » (s01 → s11) ═════════════════════════════
// Chaque concept fournit : ses adversaires (étapes), sa préparation, sa simulation DÉTERMINISTE, et sa vue.
// Le socle fait le reste : préparer → lancer → regarder → récit de la défaite → modifier → relancer.

    if (premier) l.push(`${nomDe(premier.u.id)} est tombé en premier (au pas ${premier.tombe}).`);
