<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Victoire parfaite</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&amp;family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050a08;font-family:"Fraunces",Georgia,serif}
@keyframes trace{0%{transform:scaleX(0);opacity:1}16%{transform:scaleX(1);opacity:1}88%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes noeud{0%{transform:scale(0) rotate(0);opacity:0}5%{transform:scale(1.6) rotate(45deg);opacity:1}10%{transform:scale(1) rotate(45deg)}88%{transform:scale(1) rotate(45deg);opacity:1}100%{transform:scale(1) rotate(45deg);opacity:0}}
@keyframes scintille{0%,100%{transform:scale(.4);opacity:.35}50%{transform:scale(1);opacity:1}}
@keyframes pose{0%{transform:scale(0) rotate(-40deg);opacity:0}70%{transform:scale(1.25) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes titre{0%{letter-spacing:.4em;opacity:0}100%{letter-spacing:.02em;opacity:1}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; color: #efe9dc; background: radial-gradient(ellipse 90% 55% at 50% 42%, rgba(70,52,130,0.45), transparent 72%), #05080a; display: flex; flex-direction: column; align-items: center; padding: 26px 20px 20px 20px; box-sizing: border-box;">

  <!-- des étoiles nettes qui scintillent -->
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px;">
    <sc-for list="{{ ciel }}" as="e" hint-placeholder-count="18">
      <svg width="{{ e.w }}" height="{{ e.w }}" viewBox="-10 -10 20 20" style="position: absolute; left: {{ e.x }}px; top: {{ e.y }}px; animation: scintille {{ e.t }}s ease-in-out {{ e.d }}s infinite;"><path d="M0 -10L2.4 -2.4 10 0 2.4 2.4 0 10 -2.4 2.4 -10 0 -2.4 -2.4Z" fill="{{ e.c }}"/></svg>
    </sc-for>
  </div>

  <span style="position: relative; font-size: 10px; font-weight: 600; letter-spacing: 0.24em; color: #a9b4ae;">NIVEAU 17 · LOKI LE FARCEUR</span>
  <span style="position: relative; margin-top: 4px; font-size: 58px; font-style: italic; font-weight: 600; line-height: 1.05; color: #f1d28a; text-shadow: 0 2px 0 #5a4420; animation: titre 0.9s ease-out both;">Parfait</span>
  <span style="position: relative; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 16px; color: #d9d2c3;">Les 9 cartes du Carré sont à toi.</span>

  <!-- le plateau tout vert, relié par la constellation -->
  <div style="position: relative; margin-top: 16px; padding: 10px; border-radius: 18px; background: radial-gradient(circle at 50% 45%, #2a2150 0%, #140f24 75%); border: 1px solid rgba(202,169,104,0.7); box-shadow: inset 0 0 0 4px rgba(8,6,14,0.7), inset 0 0 0 5px rgba(202,169,104,0.35), 0 10px 26px rgba(0,0,0,0.7);">
    <div style="display: grid; grid-template-columns: repeat(3, 76px); gap: 6px;">
      <sc-for list="{{ cartes }}" as="c" hint-placeholder-count="9">
        <div style="position: relative; width: 76px; height: 106px; border-radius: 8px; overflow: hidden; background: #1c1a20; box-shadow: 0 0 0 2.5px #7fd0b0;">
          <img src="{{ c.img }}" alt="" style="position: absolute; left: 5px; top: 5px; width: 66px; height: 96px; object-fit: cover; border-radius: 5px;">
          <div style="position: absolute; inset: 0; background: linear-gradient(0deg, rgba(63,156,125,0.75), transparent 30%), rgba(8,6,14,0.3);"></div>
          <span style="position: absolute; left: 30px; top: 3px; width: 16px; height: 15px; border-radius: 4px; background: rgba(10,8,16,0.92); font-size: 11px; font-weight: 700; line-height: 15px; text-align: center;">{{ c.h }}</span>
          <span style="position: absolute; right: 3px; top: 45px; width: 16px; height: 15px; border-radius: 4px; background: rgba(10,8,16,0.92); font-size: 11px; font-weight: 700; line-height: 15px; text-align: center;">{{ c.d }}</span>
          <span style="position: absolute; left: 30px; bottom: 3px; width: 16px; height: 15px; border-radius: 4px; background: rgba(10,8,16,0.92); font-size: 11px; font-weight: 700; line-height: 15px; text-align: center;">{{ c.b }}</span>
          <span style="position: absolute; left: 3px; top: 45px; width: 16px; height: 15px; border-radius: 4px; background: rgba(10,8,16,0.92); font-size: 11px; font-weight: 700; line-height: 15px; text-align: center;">{{ c.g }}</span>
        </div>
      </sc-for>
    </div>
    <!-- les traits d'or : chacun part d'un centre de carte et se déroule jusqu'au suivant -->
    <div aria-hidden="true" style="position: absolute; left: 10px; top: 10px; width: 240px; height: 330px; pointer-events: none;">
      <sc-for list="{{ traits }}" as="t" hint-placeholder-count="8">
        <div style="position: absolute; left: {{ t.x }}px; top: {{ t.y }}px; width: {{ t.l }}px; height: 3px; margin-top: -1.5px; transform-origin: 0 50%; transform: rotate({{ t.a }}deg);">
          <div style="width: 100%; height: 100%; border-radius: 2px; background: #f6dea0; box-shadow: 0 0 0 1px rgba(90,68,32,0.55); transform-origin: 0 50%; transform: scaleX(0); animation: trace 6s ease-out {{ t.d }}s infinite;"></div>
        </div>
      </sc-for>
      <sc-for list="{{ noeuds }}" as="p" hint-placeholder-count="9">
        <svg width="22" height="22" viewBox="-11 -11 22 22" style="position: absolute; left: {{ p.x }}px; top: {{ p.y }}px; margin: -11px 0 0 -11px; opacity: 0; animation: noeud 6s ease-out {{ p.d }}s infinite;"><path d="M0 -10L2.4 -2.4 10 0 2.4 2.4 0 10 -2.4 2.4 -10 0 -2.4 -2.4Z" fill="#fff4d2" stroke="#a8843f" stroke-width="0.9"/></svg>
      </sc-for>
    </div>
  </div>

  <!-- les trois étoiles, une à une -->
  <div style="position: relative; display: flex; gap: 18px; margin-top: 16px;">
    <sc-for list="{{ etoiles }}" as="s" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 92px;">
        <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true" style="animation: pose 0.6s cubic-bezier(.3,1.4,.5,1) {{ s.d }}s both;"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6-4.9-4.5 6.6-.8z" fill="#f1d28a" stroke="#fff4d2" stroke-width="0.8" stroke-linejoin="round"/></svg>
        <span style="font-family: 'Barlow Semi Condensed', sans-serif; font-size: 12px; color: #a9b4ae;">{{ s.txt }}</span>
      </div>
    </sc-for>
  </div>

  <!-- les gains -->
  <div style="position: relative; align-self: stretch; margin-top: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; border-radius: 14px; border: 1px solid rgba(202,169,104,0.5); background: rgba(6,10,9,0.8);">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.2em; color: #a9b4ae;">1RE VICTOIRE</span>
      <span style="font-size: 12px; font-style: italic; color: #f1d28a;">Le Grand Nord ★ 17 / 30 · coffre à 20 : encore 3</span>
    </div>
    <div style="display: flex; gap: 22px; align-items: center;">
      <div style="display: flex; align-items: center; gap: 6px;"><img src="/_blob/f7e518877ec3800cb268522bd61ec6ff" alt="" style="width: 30px; height: 30px;"><span style="font-size: 18px; font-weight: 600;">× 40</span></div>
      <div style="display: flex; align-items: center; gap: 6px;"><img src="/_blob/009f32f58494a16544a2e85281755653" alt="" style="width: 30px; height: 30px;"><span style="font-size: 18px; font-weight: 600;">× 1</span></div>
      <span style="font-family: 'Barlow Semi Condensed', sans-serif; font-size: 13px; color: #a9b4ae; line-height: 1.2;">La victoire parfaite ne donne rien de plus : c'est pour la gloire.</span>
    </div>
  </div>

  <button type="button" style="position: relative; align-self: stretch; margin-top: auto; height: 54px; border-radius: 14px; border: 0; background: linear-gradient(180deg, #f6dea0, #d8b56c 55%, #a8843f); box-shadow: 0 3px 0 #6d5427, inset 0 1px 0 rgba(255,255,255,0.6); color: #2b1b06; font-family: Fraunces, Georgia, serif; font-size: 23px; font-weight: 600;">Niveau suivant</button>
  <div style="position: relative; align-self: stretch; display: flex; gap: 10px; margin-top: 10px;">
    <button type="button" style="flex-grow: 1; height: 42px; border-radius: 12px; border: 1px solid rgba(202,169,104,0.6); background: #0b1411; color: #d9d2c3; font-family: Fraunces, Georgia, serif; font-size: 16px;">Rejouer</button>
    <button type="button" style="flex-grow: 1; height: 42px; border-radius: 12px; border: 1px solid rgba(202,169,104,0.6); background: #0b1411; color: #d9d2c3; font-family: Fraunces, Georgia, serif; font-size: 16px;">Le chapitre</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // centres des cartes dans la grille 240 × 330 (cartes 76 × 106, écart 6)
    var X = [38, 120, 202], Y = [53, 165, 277];
    function P(i) { return { x: X[i % 3], y: Y[Math.floor(i / 3)] }; }
    // la figure : les deux diagonales qui partent du centre, puis le losange qui l'entoure
    var liens = [[4, 0], [4, 8], [4, 2], [4, 6], [1, 5], [5, 7], [7, 3], [3, 1]];
    var traits = liens.map(function (l, k) {
      var a = P(l[0]), b = P(l[1]), dx = b.x - a.x, dy = b.y - a.y;
      return { x: a.x, y: a.y, l: Math.round(Math.sqrt(dx * dx + dy * dy)), a: (Math.atan2(dy, dx) * 180 / Math.PI).toFixed(1), d: (0.3 + k * 0.22).toFixed(2) };
    });
    var ordre = [4, 0, 8, 2, 6, 1, 5, 7, 3];
    var noeuds = ordre.map(function (i, k) { var p = P(i); return { x: p.x, y: p.y, d: (0.15 + k * 0.22).toFixed(2) }; });
    var ciel = [
      [30, 70, 10, 2.6, 0], [352, 58, 8, 3.1, 0.7], [70, 150, 6, 2.2, 1.3], [340, 170, 12, 3.4, 0.4], [14, 300, 8, 2.8, 1.9],
      [368, 330, 6, 2.4, 1.1], [22, 470, 10, 3.0, 0.2], [362, 492, 8, 2.7, 1.6], [40, 610, 6, 2.3, 0.9], [346, 640, 10, 3.3, 0.3],
      [118, 40, 6, 2.5, 1.4], [276, 34, 8, 2.9, 0.6], [196, 604, 6, 2.1, 1.8], [96, 700, 8, 3.2, 1.0], [300, 712, 6, 2.6, 0.5],
      [14, 804, 8, 2.9, 1.2], [372, 800, 6, 2.4, 0.8], [200, 12, 6, 3.1, 1.7]
    ].map(function (e, k) { return { x: e[0], y: e[1], w: e[2], t: e[3], d: e[4], c: k % 3 === 0 ? '#f1d28a' : '#e8e3f0' }; });
    return {
      ciel: ciel,
      traits: traits,
      noeuds: noeuds,
      etoiles: [
        { d: 1.2, txt: 'Gagner' },
        { d: 1.6, txt: '6 cartes ou plus' },
        { d: 2.0, txt: 'Sans stade III' }
      ],
      cartes: [
        { img: '/_blob/e84defbb49f25e88cdc63e11918224f0', h: 9, d: 5, b: 3, g: 6 },
        { img: '/_blob/ea07f2b4f766d88de58b90debbbaea94', h: 9, d: 5, b: 6, g: 6 },
        { img: '/_blob/d5c3f38da41b6f2b682360391cf6b6fa', h: 8, d: 6, b: 5, g: 4 },
        { img: '/_blob/a7153c235059a7b21bd0e8e6b02417cd', h: 6, d: 5, b: 6, g: 5 },
        { img: '/_blob/52d2daa28af6c3ec34ad04fd1be610e3', h: 7, d: 8, b: 5, g: 4 },
        { img: '/_blob/3defacbc6cef025b60855a10e0eb1a33', h: 6, d: 8, b: 4, g: 7 },
        { img: '/_blob/e2b54beee67c4b4ebab07c08299061cd', h: 6, d: 6, b: 6, g: 5 },
        { img: '/_blob/2920aa632092080feb0f4047acfcc88d', h: 5, d: 9, b: 6, g: 6 },
        { img: '/_blob/b6f5539c07c4320828020471049492e4', h: 9, d: 6, b: 4, g: 3 }
      ]
    };
  }
}
</script>
</body>
</html>
