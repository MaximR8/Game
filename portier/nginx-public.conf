# Le jeu PUBLIC (⑯, 27/09) : jeu.naspoizot.synology.me, pour les cousins.
# Servi SEULEMENT à qui a le cookie du portier (portier.py). Sans lui, toute adresse renvoie
# vers la page du code : aucun fichier du jeu ne sort.
#
# Le chemin : Internet → la box (443) → le reverse proxy de DSM (HTTPS, certificat) →
# 127.0.0.1:18480 (ce conteneur) → portier:8081 pour vérifier le cookie.
# Monté dans nginx-unprivileged (non root, en lecture seule) sur /etc/nginx/conf.d/default.conf.

server_tokens off;

# 5 essais de code par minute et par adresse (le portier bloque en plus après 10 échecs en une heure)
limit_req_zone $binary_remote_addr zone=code:1m rate=5r/m;
limit_req_status 429;

# L'adresse du visiteur : le reverse proxy de DSM la met dans X-Real-IP (règle « en-tête
# personnalisé »). On ne la croit que venant du réseau de Docker, par où DSM arrive.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Real-IP;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    client_max_body_size 1k;
    # 🔴 Des redirections RELATIVES (« Location: /entree ») : par défaut, nginx écrit l'adresse
    #    entière avec SON port et SON protocole (http://…:8080/entree), faux derrière le proxy de
    #    DSM (https, 443). Vu le 27/09, au premier essai.
    absolute_redirect off;
    port_in_redirect off;

    # Les en-têtes de sécurité, sur TOUTES les réponses (HSTS : c'est DSM qui le met — case
    # « Activer HSTS » de la règle ; l'envoyer ici aussi le doublait).
    # ⛔ Aucun add_header dans les location : il effacerait ceux-ci (règle de nginx).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://lapoussette.duckdns.org wss://lapoussette.duckdns.org; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    # Comme le jeu local : le navigateur redemande, nginx répond « 304, inchangé » (voir nginx-common.inc)
    add_header Cache-Control "no-cache, must-revalidate" always;
    etag on;
    gzip_static on;

    # Lire, et envoyer le code : rien d'autre.
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # 🔴 TOUT demande le cookie du portier…
    auth_request /_verifier;
    error_page 401 = @entree;

    location = /_verifier {
        internal;
        auth_request off;
        proxy_pass http://portier:8081/verifier;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # …sauf la page du code, et son envoi.
    location = /entree {
        auth_request off;
        limit_except GET HEAD { deny all; }
        proxy_pass http://portier:8081;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /entrer {
        auth_request off;
        limit_except POST { deny all; }
        limit_req zone=code burst=3 nodelay;
        proxy_pass http://portier:8081;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @entree {
        return 302 /entree;
    }

    # Le manifeste et les icônes (installer le jeu en app, l'icône de l'écran d'accueil) : le
    # navigateur les demande SANS cookie. Un nom et des images, rien d'autre : ils sortent sans le code.
    # (Sur iPhone, l'installer en app est la parade contre Safari qui efface la partie en 7 jours.)
    location ~ ^/index\.(manifest\.json|icon\.png|apple-touch-icon\.png|144x144\.png|180x180\.png|512x512\.png)$ {
        auth_request off;
        limit_except GET HEAD { deny all; }
    }

    location ~ \.wasm$ {
        limit_except GET HEAD { deny all; }
        default_type application/wasm;
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
