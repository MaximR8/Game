# Le jeu PUBLIC pour les cousins (⑯, 27/09) — à part du jeu local (../docker-compose.yml).
#
#   cd /volume1/docker/_NOUVEAU_PROJET/portier && docker compose up -d      démarrer (sur le NAS)
#   docker compose logs portier --tail 50                                     les essais de code
#   docker compose down                                                       tout fermer
#
# Le code : python nouveau_code.py (depuis ce dossier) — le portier relit le secret tout seul.
#
# 🔴 LE BLINDAGE (Maxim : « faut bien blinder cette page d'accès… j'ai Vesta, le jeu et d'autres
#    projets importants à pas se faire hacker ») :
#    · le jeu n'écoute que sur 127.0.0.1 : seul le reverse proxy de DSM l'atteint, pas le réseau ;
#    · son propre réseau Docker : il ne voit ni familyos, ni sa base, ni aucun autre conteneur ;
#    · aucun accès à Docker lui-même, aucun dossier du NAS en écriture ;
#    · non root, système de fichiers en lecture seule, aucun privilège (cap_drop), mémoire bornée ;
#    · échec fermé : sans secret, le portier ne démarre pas, et sans portier nginx refuse tout.

name: jeu-public

services:
  portier:
    image: python:3.12-alpine
    container_name: jeu-public-portier
    restart: unless-stopped
    command: ["python", "-u", "/app/portier.py"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 32
    environment:
      PORTIER_SECRET: /secret/portier.json
      PORTIER_PORT: "8081"
    volumes:
      - ./portier.py:/app/portier.py:ro
      - ./secret:/secret:ro
    networks: [interne]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/entree"]
      interval: 60s
      timeout: 5s
      retries: 3

  jeu:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: jeu-public
    restart: unless-stopped
    depends_on: [portier]
    ports:
      - "127.0.0.1:18480:8080"      # ⛔ jamais 0.0.0.0 : seul DSM (sur le NAS) doit l'atteindre
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    volumes:
      - ../web:/usr/share/nginx/html:ro
      - ./nginx-public.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [interne]

# ⛔ Pas de « logging: » ici : Container Manager (DSM) n'affiche que les journaux écrits dans SON
#    format ; avec json-file, l'onglet Journal disait « Aucun journal disponible » (27/09).

networks:
  interne: {}
