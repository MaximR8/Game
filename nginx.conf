# Sert le prototype web au téléphone, sur le réseau local.
# Monté dans le conteneur sur /etc/nginx/conf.d/default.conf
#
# 🔴 POURQUOI DU HTTPS SUR UN RÉSEAU LOCAL :
# Godot 4 refuse de démarrer sur le web hors « contexte sécurisé »
# (il teste `window.isSecureContext`). Ce test est INCONDITIONNEL —
# désactiver les threads ne l'évite pas. Seuls https:// et localhost
# le satisfont. D'où ce certificat auto-signé.

# ── HTTP : gardé pour le healthcheck et curl. Godot n'y démarrera pas.
server {
    listen 80;
    server_name _;
    include /etc/nginx/conf.d/common.inc;
}

# ── HTTPS : c'est ICI qu'on ouvre sur le téléphone.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/proto.crt;
    ssl_certificate_key /etc/nginx/certs/proto.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/conf.d/common.inc;
}
